name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build .app bundle
        run: cargo bundle --release

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/cert.XXXXXX.p12)
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX.keychain-db)
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" login.keychain

          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_FILE" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> "$GITHUB_ENV"
          rm "$CERT_FILE"

      - name: Sign the app
        run: |
          codesign --deep --force --options runtime \
            --sign "$SIGN_IDENTITY" \
            --keychain "$KEYCHAIN_FILE" \
            target/release/bundle/osx/Scapegrace.app

      - name: Create DMG
        run: |
          hdiutil create -volname Scapegrace \
            -srcfolder target/release/bundle/osx/Scapegrace.app \
            -ov -format UDZO \
            target/Scapegrace-mac.dmg

      - name: Sign the DMG
        run: |
          codesign --force --options runtime \
            --sign "$SIGN_IDENTITY" \
            --keychain "$KEYCHAIN_FILE" \
            target/Scapegrace-mac.dmg

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit target/Scapegrace-mac.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple target/Scapegrace-mac.dmg

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_FILE" ]; then
            security delete-keychain "$KEYCHAIN_FILE"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scapegrace-mac.dmg
          path: target/Scapegrace-mac.dmg

  build-linux:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxi-dev libgl1-mesa-dev

      - name: Build AppImage
        run: ./appimage/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scapegrace-linux.AppImage
          path: target/Scapegrace-*.AppImage

  build-windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/Scapegrace-win
          Copy-Item target/release/scapegrace.exe target/Scapegrace-win/
          if (Test-Path icon.png) { Copy-Item icon.png target/Scapegrace-win/ }
          Compress-Archive -Path target/Scapegrace-win/* -DestinationPath target/Scapegrace-win.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scapegrace-win.zip
          path: target/Scapegrace-win.zip

  release:
    needs: [build-mac, build-linux, build-windows]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Scapegrace-mac.dmg/Scapegrace-mac.dmg
            Scapegrace-linux.AppImage/Scapegrace-*.AppImage
            Scapegrace-win.zip/Scapegrace-win.zip
          generate_release_notes: true
