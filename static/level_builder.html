let mapDragEntity = null; // { levelIdx, type, index, origX, origY }

function mapEntityDragStart(e, levelIdx) {
  if (e.button !== 0) return; // left click only
  if (!mapPreviewData?.tiles) return;
  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);

  const pe = ensurePlacedEntities(levelIdx);
  // Check boss (2x2 hit area)
  if (pe.boss) {
    const [bx, by] = pe.boss;
    if (tx >= bx && tx < bx + 2 && ty >= by && ty < by + 2) {
      mapDragEntity = { levelIdx, type: 'boss', origX: bx, origY: by };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
  // Check monsters
  for (let i = 0; i < pe.monsters.length; i++) {
    if (pe.monsters[i].x === tx && pe.monsters[i].y === ty) {
      mapDragEntity = { levelIdx, type: 'monster', index: i, origX: tx, origY: ty };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
  // Check items
  for (let i = 0; i < pe.items.length; i++) {
    if (pe.items[i].x === tx && pe.items[i].y === ty) {
      mapDragEntity = { levelIdx, type: 'item', index: i, origX: tx, origY: ty };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
  // Check traps
  for (let i = 0; i < pe.traps.length; i++) {
    if (pe.traps[i].x === tx && pe.traps[i].y === ty) {
      mapDragEntity = { levelIdx, type: 'trap', index: i, origX: tx, origY: ty };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
}

function mapEntityDragMove(e) {
  if (!mapDragEntity || !mapPreviewData?.tiles) return;
  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);
  if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;

  // Show highlight at target
  const c = getCampaign(selectedCampaignId);
  const lv = c.overworld.levels[selectedLevelIdx];
  const design = c.designs[selectedLevelIdx] || {};
  const pe = ensurePlacedEntities(selectedLevelIdx);
  renderMapCanvas(mapPreviewData, lv.palette || [], design.tile_defs || [], pe).then(() => {
    const ctx = canvas.getContext('2d');
    const size = mapDragEntity.type === 'boss' ? 2 : 1;
    ctx.fillStyle = 'rgba(102, 187, 106, 0.35)';
    ctx.fillRect(tx * cellW, ty * cellH, cellW * size, cellH * size);
    ctx.strokeStyle = '#66bb6a';
    ctx.lineWidth = 2;
    ctx.strokeRect(tx * cellW + 1, ty * cellH + 1, cellW * size - 2, cellH * size - 2);
  });
}

function mapEntityDragEnd(e) {
  const canvas = document.getElementById('map-canvas');
  canvas.removeEventListener('mousemove', mapEntityDragMove);
  canvas.removeEventListener('mouseup', mapEntityDragEnd);
  canvas.style.cursor = 'default';
  if (!mapDragEntity || !mapPreviewData?.tiles) { mapDragEntity = null; return; }

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cols = mapPreviewData.tiles[0].length;
  const rows = mapPreviewData.tiles.length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);

  if (tx >= 0 && ty >= 0 && tx < cols && ty < rows && (tx !== mapDragEntity.origX || ty !== mapDragEntity.origY)) {
    const pe = ensurePlacedEntities(mapDragEntity.levelIdx);
    if (mapDragEntity.type === 'boss') {
      pe.boss = [tx, ty];
    } else if (mapDragEntity.type === 'monster') {
      pe.monsters[mapDragEntity.index].x = tx;
      pe.monsters[mapDragEntity.index].y = ty;
    } else if (mapDragEntity.type === 'item') {
      pe.items[mapDragEntity.index].x = tx;
      pe.items[mapDragEntity.index].y = ty;
    } else if (mapDragEntity.type === 'trap') {
      pe.traps[mapDragEntity.index].x = tx;
      pe.traps[mapDragEntity.index].y = ty;
    }
  }

  mapDragEntity = null;
  const c = getCampaign(selectedCampaignId);
  const lv = c.overworld.levels[selectedLevelIdx];
  const design = c.designs[selectedLevelIdx] || {};
  const pe = ensurePlacedEntities(selectedLevelIdx);
  renderMapCanvas(mapPreviewData, lv.palette || [], design.tile_defs || [], pe);
}

// ── Scrabble Tray ──

function packItemSprite(itemType) {
  return (pack.item_sprites && pack.item_sprites[itemType]) || null;
}
function packItemName(itemType) {
  const defaults = { potion: 'Health Potion', speed_potion: 'Speed Potion', bomb: 'Bomb', gold: 'Gold', key: 'Key' };
  return (pack.item_names && pack.item_names[itemType]) || defaults[itemType] || itemType;
}

function generateTray(c, levelIdx, placed) {
  const lv = c.overworld.levels[levelIdx];
  const design = c.designs[levelIdx] || {};
  const budget = lv.budget || 150;
  const floor = levelIdx + 1;
  const monsters = c.monster_templates || design.monster_types || [];
  const trapDefs = design.traps || [];

  // Compute what the budget buys (mirroring gen.rs logic)
  let rem = budget;
  const tray = [];

  // Boss: ~20% of budget (always 1, designer places it)
  const bossCost = Math.round(budget * 0.20);
  rem -= bossCost;
  const bossName = design.boss?.name || 'Boss';
  tray.push({ type: 'boss', name: bossName, icon: '💀', image: design.boss?.image || null, item_type: 'boss' });

  // Split remaining budget: ~60% monsters, ~25% gold, ~15% traps
  const monBudget = Math.round(rem * 0.6);
  const goldBudget = Math.round(rem * 0.25);
  const trapBudget = rem - monBudget - goldBudget;

  // Monsters: 6 cost each
  if (monsters.length > 0) {
    let mi = 0, mrem = monBudget;
    while (mrem >= 5) {
      mrem -= 6;
      const tmpl = monsters[mi % monsters.length];
      tray.push({ type: 'monster', name: tmpl.name, icon: '👾', image: tmpl.image || null, item_type: 'monster' });
      mi++;
    }
  }

  // Gold piles: 3 cost each
  let grem = goldBudget;
  let gi = 0;
  while (grem >= 3 && gi < 6) {
    grem -= 3;
    tray.push({ type: 'item', name: packItemName('gold'), icon: '💰', item_type: 'gold', image: packItemSprite('gold') });
    gi++;
  }

  // Traps: 5 cost each
  if (trapDefs.length > 0) {
    let trem = trapBudget, ti = 0;
    while (trem >= 5) {
      trem -= 5;
      const td = trapDefs[ti % trapDefs.length];
      tray.push({ type: 'trap', name: td.name || 'Trap', icon: '⚠', item_type: 'trap', image: td.image || null });
      ti++;
    }
  }

  // Free items: weapon, armor, potions, key
  tray.push({ type: 'item', name: design.weapon?.name || 'Weapon', icon: '⚔', item_type: 'weapon', image: design.weapon?.image || null });
  tray.push({ type: 'item', name: design.armor?.name || 'Armor', icon: '🛡', item_type: 'armor', image: design.armor?.image || null });
  const monCount = tray.filter(t => t.type === 'monster').length;
  const potionCount = Math.max(1, Math.floor(monCount / 6));
  for (let i = 0; i < potionCount; i++) {
    tray.push({ type: 'item', name: packItemName('potion'), icon: '🧪', item_type: 'potion', image: packItemSprite('potion') });
  }
  if (design.prebuilt_map?.key_position) {
    tray.push({ type: 'item', name: packItemName('key'), icon: '🔑', item_type: 'key', image: packItemSprite('key') });
  }

  // Remove already-placed entities from the tray
  const placedMonsters = [...(placed.monsters || [])];
  const placedItems = [...(placed.items || [])];
  const placedTraps = [...(placed.traps || [])];

  return tray.filter(t => {
    if (t.type === 'boss') {
      if (placed.boss) return false; // boss already placed
    } else if (t.type === 'monster') {
      const idx = placedMonsters.findIndex(pm => pm.name === t.name);
      if (idx >= 0) { placedMonsters.splice(idx, 1); return false; }
    } else if (t.type === 'item') {
      const idx = placedItems.findIndex(pi => pi.item_type === t.item_type);
      if (idx >= 0) { placedItems.splice(idx, 1); return false; }
    } else if (t.type === 'trap') {
      const idx = placedTraps.findIndex(pt => pt.name === t.name);
      if (idx >= 0) { placedTraps.splice(idx, 1); return false; }
    }
    return true;
  });
}

let draggedTrayItem = null;
let dragHighlightTile = null; // {x, y} of currently highlighted tile during drag

function displaceAll(levelIdx) {
  const c = getCampaign(selectedCampaignId);
  const d = ensureDesign(levelIdx);
  d.placed_entities = { monsters: [], items: [], traps: [], boss: null };
}

function autoplaceAll(levelIdx) {
  const c = getCampaign(selectedCampaignId);
  const pe = ensurePlacedEntities(levelIdx);
  const tray = generateTray(c, levelIdx, pe);
  if (tray.length === 0) { showToast('Nothing to place', 'info'); return; }
  if (!mapPreviewData?.tiles) return;

  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const design = c.designs[levelIdx] || {};
  const defs = design.tile_defs || [];
  const wallName = defs[0]?.name || 'wall';
  const occupied = new Set();
  for (const m of pe.monsters) occupied.add(m.x + ',' + m.y);
  for (const i of pe.items) occupied.add(i.x + ',' + i.y);
  for (const t of pe.traps) occupied.add(t.x + ',' + t.y);
  if (mapPreviewData.player_start) occupied.add(mapPreviewData.player_start[0] + ',' + mapPreviewData.player_start[1]);
  if (pe.boss) occupied.add(pe.boss[0]+','+pe.boss[1]);

  const isOpen = (x,y) => x>=0 && y>=0 && x<cols && y<rows &&
    mapPreviewData.tiles[y][x] !== wallName && mapPreviewData.tiles[y][x] !== 'locked_door' && !occupied.has(x+','+y);

  // Place boss first — needs 2x2 area, prefer the map's suggested boss room (farthest from player)
  const bossTray = tray.find(t => t.type === 'boss');
  if (bossTray) {
    // Find all valid 2x2 spots
    const spots2x2 = [];
    for (let y = 0; y < rows - 1; y++) {
      for (let x = 0; x < cols - 1; x++) {
        if (isOpen(x,y) && isOpen(x+1,y) && isOpen(x,y+1) && isOpen(x+1,y+1)) {
          spots2x2.push([x, y]);
        }
      }
    }
    if (spots2x2.length > 0) {
      // Pick the spot farthest from player start
      const [px, py] = mapPreviewData.player_start || [0, 0];
      spots2x2.sort((a, b) => {
        const da = (a[0]-px)**2 + (a[1]-py)**2;
        const db = (b[0]-px)**2 + (b[1]-py)**2;
        return db - da;
      });
      const [bx, by] = spots2x2[0];
      pe.boss = [bx, by];
      // Mark 2x2 as occupied
      for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++) occupied.add((bx+dx)+','+(by+dy));
    }
  }

  // Collect walkable tiles for everything else
  const walkable = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (isOpen(x,y)) walkable.push([x, y]);
    }
  }
  // Shuffle
  for (let i = walkable.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [walkable[i], walkable[j]] = [walkable[j], walkable[i]];
  }

  let wi = 0;
  for (const t of tray) {
    if (t.type === 'boss') continue; // already placed
    if (wi >= walkable.length) break;
    const [rx, ry] = walkable[wi++];
    if (t.type === 'monster') pe.monsters.push({ name: t.name, x: rx, y: ry });
    else if (t.type === 'item') pe.items.push({ name: t.name, item_type: t.item_type, x: rx, y: ry });
    else if (t.type === 'trap') pe.traps.push({ name: t.name, x: rx, y: ry });
  }

  renderLevelScreen(document.getElementById('screen-container'));
  showCurrentMap();
  showToast(`Placed ${Math.min(tray.length, wi)} entities`, 'success');
}

function trayDragOver(e) {

  if (!draggedTrayItem || !mapPreviewData?.tiles) return;
  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();

  const rows = mapPreviewData.tiles.length;

  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);
  if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) { trayDragLeave(); return; }
  if (!dragHighlightTile || dragHighlightTile.x !== tx || dragHighlightTile.y !== ty) {
    dragHighlightTile = { x: tx, y: ty };
    // Draw highlight on the canvas
    const ctx = canvas.getContext('2d');
    // Redraw map first (restore from last full render), then overlay highlight
    const c = getCampaign(selectedCampaignId);
    const lv = c.overworld.levels[selectedLevelIdx];
    const design = c.designs[selectedLevelIdx] || {};
    const pe = ensurePlacedEntities(selectedLevelIdx);
    renderMapCanvas(mapPreviewData, lv.palette || [], design.tile_defs || [], pe).then(() => {
      const ctx2 = canvas.getContext('2d');
      ctx2.fillStyle = 'rgba(102, 187, 106, 0.35)';
      ctx2.fillRect(tx * cellW, ty * cellH, cellW, cellH);
      ctx2.strokeStyle = '#66bb6a';
      ctx2.lineWidth = 2;
      ctx2.strokeRect(tx * cellW + 1, ty * cellH + 1, cellW - 2, cellH - 2);
    });
  }
}

function trayDragLeave() {
  if (dragHighlightTile) {
    dragHighlightTile = null;
    // Redraw without highlight
    const c = getCampaign(selectedCampaignId);
    if (c && selectedLevelIdx !== null) {
      const lv = c.overworld.levels[selectedLevelIdx];
      const design = c.designs[selectedLevelIdx] || {};
      const pe = ensurePlacedEntities(selectedLevelIdx);
      renderMapCanvas(mapPreviewData, lv.palette || [], design.tile_defs || [], pe);
    }
  }
}

function trayAutoPlace(levelIdx, trayIdx) {
  const c = getCampaign(selectedCampaignId);
  const pe = ensurePlacedEntities(levelIdx);
  const tray = generateTray(c, levelIdx, pe);
  if (trayIdx >= tray.length) return;
  const t = tray[trayIdx];
  if (!mapPreviewData?.tiles) return;

  // Find a random walkable tile not occupied by anything
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const design = c.designs[levelIdx] || {};
  const defs = design.tile_defs || [];
  const wallName = defs[0]?.name || 'wall';
  const occupied = new Set();
  for (const m of pe.monsters) occupied.add(m.x + ',' + m.y);
  for (const i of pe.items) occupied.add(i.x + ',' + i.y);
  for (const t of pe.traps) occupied.add(t.x + ',' + t.y);
  if (mapPreviewData.player_start) occupied.add(mapPreviewData.player_start[0] + ',' + mapPreviewData.player_start[1]);
  if (mapPreviewData.boss_position) {
    const [bx,by] = mapPreviewData.boss_position;
    for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++) occupied.add((bx+dx)+','+(by+dy));
  }

  const candidates = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const tile = mapPreviewData.tiles[y][x];
      if (tile !== wallName && tile !== 'locked_door' && !occupied.has(x+','+y)) {
        candidates.push([x, y]);
      }
    }
  }
  if (t.type === 'boss') {
    // Boss needs 2x2, pick farthest from player
    const [px, py] = mapPreviewData.player_start || [0, 0];
    const spots = [];
    for (let y = 0; y < rows - 1; y++) {
      for (let x = 0; x < cols - 1; x++) {
        const ok = [[x,y],[x+1,y],[x,y+1],[x+1,y+1]].every(([cx,cy]) =>
          mapPreviewData.tiles[cy][cx] !== wallName && mapPreviewData.tiles[cy][cx] !== 'locked_door' && !occupied.has(cx+','+cy));
        if (ok) spots.push([x, y, (x-px)**2 + (y-py)**2]);
      }
    }
    if (spots.length === 0) { showToast('No 2x2 area for boss!', 'error'); return; }
    spots.sort((a,b) => b[2] - a[2]);
    pe.boss = [spots[0][0], spots[0][1]];
  } else {
    if (candidates.length === 0) { showToast('No open tiles!', 'error'); return; }
    const [rx, ry] = candidates[Math.floor(Math.random() * candidates.length)];
    if (t.type === 'monster') pe.monsters.push({ name: t.name, x: rx, y: ry });
    else if (t.type === 'item') pe.items.push({ name: t.name, item_type: t.item_type, x: rx, y: ry });
    else if (t.type === 'trap') pe.traps.push({ name: t.name, x: rx, y: ry });
  }

  renderLevelScreen(document.getElementById('screen-container'));
  showCurrentMap();
}

function trayDragStart(e, levelIdx, trayIdx) {
  const c = getCampaign(selectedCampaignId);
  const pe = ensurePlacedEntities(levelIdx);
  const tray = generateTray(c, levelIdx, pe);
  draggedTrayItem = { levelIdx, item: tray[trayIdx] };
  e.dataTransfer.setData('text/plain', 'tray');
  e.dataTransfer.effectAllowed = 'move';
}

function trayDrop(e, levelIdx) {
  e.preventDefault();
  if (!draggedTrayItem || !mapPreviewData?.tiles) return;

  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);
  if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;

  const t = draggedTrayItem.item;
  const pe = ensurePlacedEntities(levelIdx);

  if (t.type === 'boss') {
    pe.boss = [tx, ty];
  } else if (t.type === 'monster') {
    pe.monsters.push({ name: t.name, x: tx, y: ty });
  } else if (t.type === 'item') {
    pe.items.push({ name: t.name, item_type: t.item_type, x: tx, y: ty });
  } else if (t.type === 'trap') {
    pe.traps.push({ name: t.name, x: tx, y: ty });
  }

  draggedTrayItem = null;
  dragHighlightTile = null;
  // Re-render to update tray and map
  renderLevelScreen(document.getElementById('screen-container'));
  showCurrentMap();
}

function onMapRightClick(e, levelIdx) {
  e.preventDefault();
  if (!mapPreviewData?.tiles) return;

  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);

  const pe = ensurePlacedEntities(levelIdx);
  // Remove any entity at this position
  const hadMonster = pe.monsters.length;
  const hadItem = pe.items.length;
  const hadTrap = pe.traps.length;
  let hadBoss = false;
  if (pe.boss) {
    const [bx, by] = pe.boss;
    if (tx >= bx && tx < bx + 2 && ty >= by && ty < by + 2) { pe.boss = null; hadBoss = true; }
  }
  pe.monsters = pe.monsters.filter(m => m.x !== tx || m.y !== ty);
  pe.items = pe.items.filter(i => i.x !== tx || i.y !== ty);
  pe.traps = pe.traps.filter(t => t.x !== tx || t.y !== ty);

  if (hadBoss || pe.monsters.length < hadMonster || pe.items.length < hadItem || pe.traps.length < hadTrap) {
    renderLevelScreen(document.getElementById('screen-container'));
    showCurrentMap();
  }
}

async function regenerateMap(levelIdx) {
  const c = getCampaign(selectedCampaignId);
  const design = c.designs[levelIdx];
  const lv = c.overworld.levels[levelIdx];
  if (!design || !design.tile_defs || design.tile_defs.length < 2) {
    showToast('Need at least 2 tile definitions', 'error');
    return;
  }
  const st = document.getElementById('map-status');
  if (st) st.innerHTML = '<span class="spinner"></span> Generating...';
  try {
    const result = await api('POST', '/api/generate-map', {
      tile_defs: design.tile_defs,
      palette: lv.palette || []
    });
    mapPreviewData = result;
    design.prebuilt_map = result;
    // Displace all entities — new map means old positions are invalid
    displaceAll(levelIdx);
    renderLevelScreen(document.getElementById('screen-container'));
    showCurrentMap();
    if (st) st.textContent = 'Map regenerated — entities returned to tray';
  } catch(e) {
    showToast('Map generation failed: ' + e.message, 'error');
    if (st) st.textContent = 'Failed';
  }
}

// Cache for loaded tile images
let tileImageCache = {};

function loadTileImages(tileDefs) {
  const promises = [];
  for (let i = 0; i < tileDefs.length; i++) {
    const td = tileDefs[i];
    if (td.image && !tileImageCache[td.name]) {
      const img = new Image();
      const p = new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
      img.src = 'data:image/png;base64,' + td.image;
      tileImageCache[td.name] = img;
      promises.push(p);
    }
  }
  return Promise.all(promises);
}

async function renderMapCanvas(data, palette, tileDefs, placedEntities) {
  const canvas = document.getElementById('map-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const tiles = data.tiles;
  if (!tiles || !tiles.length) return;
  const rows = tiles.length;
  const cols = tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;

  // Load any tile images first
  tileImageCache = {};
  await loadTileImages(tileDefs);

  // Build tileName → color map
  const nameToColor = {};
  const nameToChar = {};
  const nameToImg = {};
  for (let i = 0; i < tileDefs.length; i++) {
    const name = tileDefs[i].name;
    nameToColor[name] = palette[i] || (i === 0 ? '#444' : '#333');
    if (tileDefs[i].char) nameToChar[name] = tileDefs[i].char;
    if (tileImageCache[name]) nameToImg[name] = tileImageCache[name];
  }
  nameToColor['wall'] = nameToColor['wall'] || '#444';
  nameToColor['locked_door'] = '#aa6622';
  nameToChar['locked_door'] = '🔒';

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const name = tiles[r][c];
      const img = nameToImg[name];
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, c * cellW, r * cellH, cellW, cellH);
      } else {
        ctx.fillStyle = nameToColor[name] || '#222';
        ctx.fillRect(c * cellW, r * cellH, cellW, cellH);
        const ch = nameToChar[name];
        if (ch && cellW >= 6) {
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.font = `${Math.min(cellW, cellH) * 0.7}px monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(ch, c * cellW + cellW/2, r * cellH + cellH/2);
        }
      }
    }
  }

  // Player start (green)
  if (data.player_start) {
    const [px, py] = data.player_start;
    ctx.fillStyle = '#66bb6a';
    ctx.fillRect(px * cellW + 2, py * cellH + 2, cellW - 4, cellH - 4);
  }
  // Boss room tint — highlight the room around the map's suggested boss position
  const peCheck = placedEntities || (selectedLevelIdx !== null ? getCampaign(selectedCampaignId)?.designs?.[selectedLevelIdx]?.placed_entities : null);
  if (data.boss_position && !(peCheck && peCheck.boss)) {
    const [bx, by] = data.boss_position;
    const wallName = tileDefs[0]?.name || 'wall';
    // Flood fill the boss room, but don't pass through chokepoints (1-wide passages)
    const isWalkable = (x,y) => x>=0&&y>=0&&x<cols&&y<rows&&tiles[y][x]!==wallName&&tiles[y][x]!=='locked_door';
    const isChokepoint = (x,y) => {
      // A tile is a chokepoint if it has walls on opposite sides (N+S or E+W)
      const n=!isWalkable(x,y-1), s=!isWalkable(x,y+1), e=!isWalkable(x+1,y), w=!isWalkable(x-1,y);
      return (n&&s)||(e&&w);
    };
    const visited = new Set();
    const queue = [[bx, by]];
    visited.add(bx+','+by);
    while (queue.length > 0) {
      const [cx, cy] = queue.shift();
      for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
        const nx=cx+dx, ny=cy+dy, key=nx+','+ny;
        if (isWalkable(nx,ny) && !visited.has(key) && !isChokepoint(nx,ny)) {
          visited.add(key);
          queue.push([nx, ny]);
        }
      }
    }
    ctx.fillStyle = 'rgba(233,69,96,0.12)';
    for (const key of visited) {
      const [rx, ry] = key.split(',').map(Number);
      ctx.fillRect(rx * cellW, ry * cellH, cellW, cellH);
    }
  }
  // Key position (cyan)
  if (data.key_position) {
    const [kx, ky] = data.key_position;
    ctx.fillStyle = '#4dd0e1';
    ctx.fillRect(kx * cellW + 2, ky * cellH + 2, cellW - 4, cellH - 4);
  }

  // ── Draw placed entities ──
  const pe = placedEntities || (selectedLevelIdx !== null ? getCampaign(selectedCampaignId)?.designs?.[selectedLevelIdx]?.placed_entities : null);
  if (pe) {
    ctx.font = `${Math.min(cellW, cellH) * 0.7}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Boss (red, 2x2)
    if (pe.boss) {
      const [bx, by] = pe.boss;
      // Try to draw boss sprite
      const c2 = getCampaign(selectedCampaignId);
      const bossImg = c2?.designs?.[selectedLevelIdx]?.boss?.image;
      if (bossImg) {
        const img = new Image();
        img.src = 'data:image/png;base64,' + bossImg;
        if (img.complete) {
          ctx.drawImage(img, bx * cellW, by * cellH, cellW * 2, cellH * 2);
        } else {
          img.onload = () => ctx.drawImage(img, bx * cellW, by * cellH, cellW * 2, cellH * 2);
        }
      } else {
        ctx.fillStyle = 'rgba(233,69,96,0.7)';
        ctx.fillRect(bx * cellW, by * cellH, cellW * 2, cellH * 2);
        ctx.fillStyle = '#fff';
        ctx.fillText('💀', bx * cellW + cellW, by * cellH + cellH);
      }
      ctx.strokeStyle = '#e94560';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx * cellW, by * cellH, cellW * 2, cellH * 2);
    }
    // Monsters — use campaign sprite if available
    const c3 = getCampaign(selectedCampaignId);
    const campaignMonsters = c3?.monster_templates || [];
    for (const m of (pe.monsters || [])) {
      const tmpl = campaignMonsters.find(t => t.name === m.name);
      if (tmpl && tmpl.image) {
        const img = new Image();
        img.src = 'data:image/png;base64,' + tmpl.image;
        const mx = m.x, my = m.y;
        const drawIt = () => ctx.drawImage(img, mx * cellW + 1, my * cellH + 1, cellW - 2, cellH - 2);
        if (img.complete) drawIt(); else img.onload = drawIt;
      } else {
        ctx.fillStyle = 'rgba(255,105,180,0.6)';
        ctx.fillRect(m.x * cellW, m.y * cellH, cellW, cellH);
        ctx.fillStyle = '#fff';
        ctx.fillText('👾', m.x * cellW + cellW/2, m.y * cellH + cellH/2);
      }
    }
    // Items — use sprite if available (pack-level or design-level), else emoji
    const itemIcons = { potion: '🧪', gold: '💰', weapon: '⚔', armor: '🛡', key: '🔑', speed_potion: '⚡', bomb: '💣' };
    for (const it of (pe.items || [])) {
      const sprite = packItemSprite(it.item_type);
      if (sprite) {
        const img = new Image();
        img.src = 'data:image/png;base64,' + sprite;
        const ix = it.x, iy = it.y;
        const drawIt = () => ctx.drawImage(img, ix * cellW + 1, iy * cellH + 1, cellW - 2, cellH - 2);
        if (img.complete) drawIt(); else img.onload = drawIt;
      } else {
        ctx.fillStyle = 'rgba(255,167,38,0.5)';
        ctx.fillRect(it.x * cellW, it.y * cellH, cellW, cellH);
        ctx.fillStyle = '#fff';
        ctx.fillText(itemIcons[it.item_type] || '📦', it.x * cellW + cellW/2, it.y * cellH + cellH/2);
      }
    }
    // Traps (red X)
    for (const t of (pe.traps || [])) {
      ctx.fillStyle = 'rgba(255,68,68,0.5)';
      ctx.fillRect(t.x * cellW, t.y * cellH, cellW, cellH);
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 2;
      const cx = t.x * cellW, cy = t.y * cellH;
      ctx.beginPath(); ctx.moveTo(cx+2, cy+2); ctx.lineTo(cx+cellW-2, cy+cellH-2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+cellW-2, cy+2); ctx.lineTo(cx+2, cy+cellH-2); ctx.stroke();
    }
  }
}

// ── AI Generation ──
async function aiGenDesc(levelIdx, target) {
  const c = getCampaign(selectedCampaignId);
  const lv = c.overworld.levels[levelIdx];
  const context = `Campaign: ${c.overworld.name}. Level: ${lv.name}. Theme: ${lv.theme}`;
  try {
    showToast('Generating...', 'info');
    const r = await api('POST', '/api/generate/description', { context, target });
    if (target.includes('description')) {
      lv.description = r.text;
    } else if (target.includes('theme')) {
      lv.theme = r.text;
    }
    refreshLevelEditor();
    showToast('Generated!', 'success');
  } catch(e) { showToast('AI generation failed: ' + e.message, 'error'); }
}

async function aiGenField(levelIdx, target) {
  const c = getCampaign(selectedCampaignId);
  const lv = c.overworld.levels[levelIdx];
  const d = ensureDesign(levelIdx);
  const context = `Campaign: ${c.overworld.name}. Level: ${lv.name}. Theme: ${lv.theme}`;
  try {
    showToast('Generating...', 'info');
    const r = await api('POST', '/api/generate/description', { context, target });
    const text = r.text.trim();
    if (target.includes('boss name')) d.boss.name = text;
    else if (target.includes('boss description')) d.boss.description = text;
    else if (target.startsWith('monster')) {
      const parts = target.split(' ');
      const mi = parseInt(parts[1]);
      if (target.includes('name')) d.monster_types[mi].name = text;
      else d.monster_types[mi].description = text;
    }
    else if (target.includes('weapon name')) d.weapon.name = text;
    else if (target.includes('weapon description')) d.weapon.description = text;
    else if (target.includes('armor name')) d.armor.name = text;
    else if (target.includes('armor description')) d.armor.description = text;
    else if (target.includes('victory')) d.victory_message = text;
    else if (target.includes('defeat')) d.defeat_message = text;
    refreshLevelEditor();
    showToast('Generated!', 'success');
  } catch(e) { showToast('AI generation failed: ' + e.message, 'error'); }
}

async function aiGenFullLevel(levelIdx) {
  const c = getCampaign(selectedCampaignId);
  const lv = c.overworld.levels[levelIdx];
  const theme = prompt('Describe the level theme/vibe for the AI:', lv.theme || '');
  if (theme === null) return;
  lv.theme = theme;
  showToast('Generating full level design...', 'info');
  try {
    const result = await api('POST', '/api/generate/level-design', {
      campaign_name: c.overworld.name,
      campaign_desc: c.overworld.description,
      level_config: {
        title: lv.name,
        font: lv.font || c.overworld.font || '',
        description: lv.description,
        theme: theme,
        palette: lv.palette || [],
        budget: lv.budget || 150,
        floor: levelIdx + 1,
        campaign_tier: 0
      },
      theme: pack.theme || null
    });
    c.designs[levelIdx] = result;
    refreshLevelEditor();
    showToast('Full level design generated!', 'success');
  } catch(e) { showToast('Generation failed: ' + e.message, 'error'); }
}

// ── Init ──
async function init() {
  await Promise.all([loadPack(), loadFonts()]);
  render();
}
init();
</script>
