<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scapegrace Level Builder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1a2e; --panel: #16213e; --card: #0f3460; --text: #e8e8e8;
  --accent: #e94560; --accent2: #0f3460; --border: #2a3a5e; --input-bg: #0d1b36;
  --success: #66bb6a; --warning: #ffa726; --gold: #ffd700;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
input, select, textarea, button { font-family: inherit; font-size: 13px; color: var(--text); }
input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 50px; }
.enhanced-textarea { position: relative; display: flex; flex: 1; }
.enhanced-textarea textarea { flex: 1; border-radius: 4px 0 0 4px; }
.enhanced-textarea .enhance-btn { width: 24px; background: rgba(255,255,255,.04); border: 1px solid var(--border); border-left: none; border-radius: 0 4px 4px 0; font-size: 13px; cursor: pointer; opacity: 0.35; transition: opacity .15s, background .15s; padding: 0; display: flex; align-items: center; justify-content: center; }
.enhanced-textarea .enhance-btn:hover { opacity: 1; background: rgba(90,58,142,.3); }
input[type="color"] { width: 40px; height: 28px; padding: 1px 2px; cursor: pointer; border: 1px solid var(--border); border-radius: 4px; background: var(--input-bg); }
input[type="number"] { width: 70px; }
button { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 6px 14px; cursor: pointer; transition: background .15s; }
button:hover { background: #1a4a80; }
button.primary { background: var(--accent); border-color: var(--accent); }
button.primary:hover { background: #c73550; }
button.danger { background: #8b0000; border-color: #a00; }
button.danger:hover { background: #a00; }
button.ai-btn { background: #2a1a4e; border-color: #5a3a8e; padding: 4px 8px; font-size: 12px; }
button.ai-btn:hover { background: #3a2a6e; }
button:disabled { opacity: .5; cursor: not-allowed; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid transparent; border-top-color: var(--text); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-left: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.gap-4 { gap: 4px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.flex-1 { flex: 1; }
.w-full { width: 100%; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; }

/* Layout */
#app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.title-bar { background: var(--panel); padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.title-bar h1 { color: var(--accent); }
.screen { flex: 1; overflow: auto; padding: 20px; }

/* Cards */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
.campaign-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: transform .15s, border-color .15s; }
.campaign-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.campaign-card .card-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.campaign-card .card-desc { font-size: 12px; color: #aaa; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.campaign-card .card-meta { font-size: 11px; color: #888; display: flex; justify-content: space-between; }
.quality-badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; }

/* Collapsible */
.collapsible-header { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
.collapsible-header:hover { background: rgba(255,255,255,.07); }
.collapsible-header .arrow { transition: transform .2s; font-size: 11px; }
.collapsible-header.open .arrow { transform: rotate(90deg); }
.collapsible-body { padding: 10px 0 0 0; }
.collapsible-body.hidden { display: none; }

/* Campaign editor layout */
.campaign-layout { display: flex; height: 100%; gap: 0; }
.left-panel { width: 35%; min-width: 300px; background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; flex-shrink: 0; order: 2; }
.center-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.right-panel { width: 420px; min-width: 350px; background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; flex-shrink: 0; }

/* Full-screen level editor — map-centered with tabbed sidebar */
.level-screen { display: flex; height: 100%; overflow: hidden; }
.level-map-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0d0d1e; position: relative; min-width: 0; padding: 16px; }
.level-map-area .level-back { position: absolute; top: 12px; left: 12px; z-index: 1; }
.level-map-area .level-title { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 700; color: var(--text); text-align: center; }
.level-map-area .level-subtitle { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; }
.level-map-area .map-controls { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
/* Entity tray */
.entity-tray { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; padding: 6px 10px; margin-bottom: 6px; background: rgba(0,0,0,.3); border-radius: 8px; max-height: 80px; overflow-y: auto; }
.tray-item { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 6px; cursor: grab; user-select: none; transition: transform .1s, box-shadow .1s; position: relative; }
.tray-item:hover { background: rgba(255,255,255,.15); transform: translateY(-2px); box-shadow: 0 3px 8px rgba(0,0,0,.4); }
.tray-item::after { content: attr(data-name); position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: #111; color: #eee; font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .1s; z-index: 20; }
.tray-item:hover::after { opacity: 1; }
.tray-item:active { cursor: grabbing; opacity: .7; }
.tray-icon { font-size: 18px; line-height: 1; user-select: none; pointer-events: none; }
.level-map-area canvas { border: 1px solid var(--border); border-radius: 4px; max-width: 100%; max-height: calc(100% - 80px); }

.level-sidebar { width: 35%; min-width: 340px; max-width: 480px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.tab-bar { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab-bar button { flex: 1; padding: 10px 6px; font-size: 12px; font-weight: 600; border: none; border-radius: 0; border-bottom: 2px solid transparent; background: transparent; color: #888; cursor: pointer; white-space: nowrap; }
.tab-bar button:hover { color: var(--text); background: rgba(255,255,255,.03); }
.tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(233,69,96,.05); }
.tab-content { flex: 1; overflow-y: auto; padding: 14px; }

/* DAG */
.dag-toolbar { background: var(--panel); padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.dag-container { flex: 1; overflow: auto; position: relative; user-select: none; }
.dag-container svg { display: block; margin: 0 auto; }
.dag-header { text-align: center; padding: 20px 20px 8px; }
.dag-header h2 { margin-bottom: 4px; }
.dag-header p { opacity: 0.7; font-size: 13px; }
.dag-container svg { display: block; }
.dag-node { cursor: grab; }
.dag-node.selected rect { stroke: var(--accent); stroke-width: 3; }
.dag-node:hover rect { filter: brightness(1.3); }
.conn-group path.conn-visible { transition: stroke .15s; }
.conn-group path.conn-visible { transition: stroke .15s; }
.conn-group:hover path.conn-visible { stroke: #e94560 !important; stroke-width: 2.5; }
.conn-handle { opacity: 0; transition: all .15s; }
.dag-node:hover .conn-handle { opacity: 1; }
.conn-handle:hover { fill: #e94560 !important; stroke: #fff !important; opacity: 1; }
.dag-popup { position: absolute; background: var(--panel); border: 1px solid var(--accent); border-top: none; border-radius: 0 0 8px 8px; padding: 4px 6px; z-index: 10; transform: translateX(-50%); }

/* Form helpers */
.form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.form-row label { min-width: 100px; font-size: 12px; color: #aaa; flex-shrink: 0; }
.form-row input, .form-row select, .form-row textarea { flex: 1; }
.form-row-stacked { margin-bottom: 8px; }
.form-row-stacked label { display: block; font-size: 12px; color: #aaa; margin-bottom: 3px; }
.form-row-stacked input, .form-row-stacked select, .form-row-stacked textarea { width: 100%; }
.section-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.note { font-size: 11px; color: #666; font-style: italic; }

/* Palette row */
.palette-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.palette-swatch { position: relative; }
.palette-swatch .remove-color { position: absolute; top: -6px; right: -6px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 9px; line-height: 14px; text-align: center; cursor: pointer; display: none; border: none; padding: 0; }
.palette-swatch:hover .remove-color { display: block; }

/* Table */
.tile-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.tile-table th { text-align: left; padding: 4px 6px; color: #888; border-bottom: 1px solid var(--border); }
.tile-table td { padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,.05); }
.tile-table input { font-size: 12px; padding: 3px 5px; }
.color-swatch { width: 20px; height: 20px; border-radius: 3px; border: 1px solid var(--border); display: inline-block; vertical-align: middle; }

/* Font picker */
.font-picker-btn { width: 100%; text-align: left; padding: 5px 8px; font-size: 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.font-picker-btn:hover { border-color: var(--accent); }
#font-picker-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 100; display: flex; align-items: center; justify-content: center; }
.font-picker-modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 400px; max-height: 500px; display: flex; flex-direction: column; overflow: hidden; }
.font-picker-modal input { margin: 10px; font-size: 14px; padding: 8px 10px; border-radius: 6px; }
.font-list { flex: 1; overflow-y: auto; }
.font-option { padding: 8px 14px; font-size: 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.03); }
.font-option:hover { background: rgba(233,69,96,.1); }

/* Map preview */
.map-canvas { border: 1px solid var(--border); border-radius: 4px; background: #000; display: block; }

/* Toasts */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: 6px; color: #fff; font-size: 13px; animation: toastIn .3s; max-width: 350px; }
.toast.success { background: #2e7d32; }
.toast.error { background: #c62828; }
.toast.info { background: #1565c0; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Entry list items */
.entry-item { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
.entry-item .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="app">
  <div class="title-bar">
    <div class="flex gap-8 items-center">
      <span id="back-btn"></span>
      <h1>Scapegrace Level Builder</h1>
    </div>
    <div class="flex gap-8 items-center">
      <span id="save-status" style="font-size:12px;color:#888;"></span>
      <button class="primary" onclick="savePack()">Save Pack</button>
    </div>
  </div>
  <div id="screen-container" class="screen"></div>
</div>
<div class="toast-container" id="toasts"></div>

<script>
// ── State ──
let pack = null;
let fonts = [];
let selectedCampaignId = null;
let selectedLevelIdx = null;
let dagPositions = {};
let dagDragging = null;
let dagDragOffset = { x: 0, y: 0 };
let dagDragMoved = false;
let addConnectionMode = false;
let connectionSource = null;
let loadedGoogleFonts = new Set();
let mapPreviewData = null;
let dagSelectedNode = null;
let dagClickTimer = null;
let dagClickNodeId = null;

const ROOTS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES = ['ionian','dorian','phrygian','lydian','mixolydian','aeolian','locrian','pentatonic_major','pentatonic_minor','blues','whole_tone','chromatic'];

// ── API ──
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    const t = await r.text();
    throw new Error(t || r.statusText);
  }
  if (r.status === 200 && r.headers.get('content-type')?.includes('json')) return r.json();
  return null;
}

async function loadPack() {
  try {
    pack = await api('GET', '/api/pack');
    if (!pack.strings) pack.strings = {};
    if (!pack.campaigns) pack.campaigns = [];
  } catch(e) { showToast('Failed to load pack: ' + e.message, 'error'); }
}

async function savePack() {
  try {
    await api('PUT', '/api/pack', pack);
    showToast('Pack saved', 'success');
  } catch(e) { showToast('Save failed: ' + e.message, 'error'); }
}

async function loadFonts() {
  try { fonts = await api('GET', '/api/fonts'); } catch(e) { fonts = []; }
}

function loadGoogleFont(name) {
  if (!name || loadedGoogleFonts.has(name)) return;
  loadedGoogleFonts.add(name);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(name)}&display=swap`;
  document.head.appendChild(link);
}

// ── Toasts ──
function showToast(msg, type = 'info') {
  const c = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 4000);
}

// ── Navigation ──
function navigate(screen, campaignId, levelIdx) {
  selectedCampaignId = campaignId || null;
  selectedLevelIdx = levelIdx !== undefined ? levelIdx : null;
  render();
}

function render() {
  const el = document.getElementById('screen-container');
  const bb = document.getElementById('back-btn');
  if (selectedCampaignId && selectedLevelIdx !== null) {
    el.style.padding = '0';
    el.style.overflow = 'hidden';
    bb.innerHTML = `<button onclick="selectedLevelIdx=null;render()" style="padding:4px 10px;">&larr; Campaign</button>`;
    renderLevelScreen(el);
    showCurrentMap();
  } else if (selectedCampaignId) {
    el.style.padding = '0';
    el.style.overflow = 'hidden';
    bb.innerHTML = `<button onclick="navigate()" style="padding:4px 10px;">&larr; Campaigns</button>`;
    renderCampaignEditor(el);
  } else {
    el.style.padding = '20px';
    el.style.overflow = 'auto';
    bb.innerHTML = '';
    renderPackOverview(el);
  }
}

// ── Helpers ──
function getCampaign(id) { return pack.campaigns.find(c => c.id === id); }
function h(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// Enhanced textarea with inline ✨ Enhance button
function enhancedTextarea(value, onchange, context, rows) {
  const uid = 'eta_' + Math.random().toString(36).substr(2, 6);
  const rowsAttr = rows ? ` rows="${rows}"` : '';
  return `<div class="enhanced-textarea">
    <textarea id="${uid}" onchange="${onchange}"${rowsAttr}>${h(value)}</textarea>
    <button class="enhance-btn" onclick="enhanceText('${uid}','${h(context)}')" title="Enhance with AI">&#10024;</button>
  </div>`;
}

function enhancedInput(value, onchange, context, extraStyle) {
  const uid = 'ei_' + Math.random().toString(36).substr(2, 6);
  return `<div class="enhanced-textarea">
    <input id="${uid}" value="${h(value)}" onchange="${onchange}" style="${extraStyle||''}">
    <button class="enhance-btn" onclick="enhanceText('${uid}','${h(context)}')" title="Enhance with AI">&#10024;</button>
  </div>`;
}

async function enhanceText(textareaId, context) {
  const el = document.getElementById(textareaId);
  if (!el || !el.value.trim()) return;
  const btn = el.parentElement.querySelector('.enhance-btn');
  const oldText = btn.innerHTML;
  btn.innerHTML = '<span class="spinner" style="width:10px;height:10px;"></span>';
  btn.disabled = true;
  try {
    const isOneLine = context.includes('one-line') || el.tagName === 'INPUT';
    const maxLen = isOneLine ? 'max 12 words, one line' : 'max 5 lines';
    const r = await api('POST', '/api/generate/description', {
      context: context || 'roguelike game',
      target: (el.value.trim().length < 3
        ? `Generate a short, vivid ${context} (${maxLen})`
        : `Rewrite this ${context} to be more vivid and atmospheric (${maxLen}): ${el.value}`)
    });
    el.value = r.text;
    el.dispatchEvent(new Event('change'));
    showToast('Enhanced!', 'success');
  } catch(e) { showToast('Enhance failed: ' + e.message, 'error'); }
  btn.innerHTML = oldText;
  btn.disabled = false;
}
let allGoogleFonts = null; // lazy-loaded full list

async function loadAllGoogleFonts() {
  if (allGoogleFonts) return allGoogleFonts;
  try {
    const r = await fetch('/api/google-fonts');
    allGoogleFonts = await r.json();
  } catch(e) {
    allGoogleFonts = fonts; // fallback to embedded list
  }
  return allGoogleFonts;
}

let fontPickerCallback = null;
let fontPickerVisible = false;

function fontSelect(current, onchange, id) {
  if (current) loadGoogleFont(current);
  const style = current ? `font-family:'${current}',system-ui` : '';
  const uid = id || ('fp_' + Math.random().toString(36).substr(2,6));
  return `<div style="flex:1;position:relative;">
    <button id="${uid}" class="font-picker-btn" style="${style}" onclick="openFontPicker('${uid}',function(v){${onchange.replace('this.value','v')}})">${current ? h(current) : '-- none --'}</button>
  </div>`;
}

function openFontPicker(btnId, cb) {
  fontPickerCallback = { btnId, cb };
  // Create overlay
  let overlay = document.getElementById('font-picker-overlay');
  if (overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.id = 'font-picker-overlay';
  overlay.innerHTML = `
    <div class="font-picker-modal">
      <input id="font-search" placeholder="Search fonts..." autofocus oninput="filterFontList(this.value)">
      <div id="font-list" class="font-list"><div style="padding:20px;color:#888;">Loading fonts...</div></div>
    </div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  loadAllGoogleFonts().then(fonts => renderFontList(fonts, ''));
}

function renderFontList(fontList, filter) {
  const el = document.getElementById('font-list');
  if (!el) return;
  const filtered = filter ? fontList.filter(f => f.toLowerCase().includes(filter.toLowerCase())) : fontList.slice(0, 120);
  let html = `<div class="font-option" onclick="selectFont('')" style="color:#888;">-- none --</div>`;
  for (const f of filtered.slice(0, 120)) {
    loadGoogleFont(f);
    html += `<div class="font-option" onclick="selectFont('${h(f)}')" style="font-family:'${f}',system-ui">${h(f)}</div>`;
  }
  if (filtered.length > 120) html += `<div style="padding:8px;color:#666;font-size:11px;">Type to search ${filtered.length - 120} more...</div>`;
  el.innerHTML = html;
}

function filterFontList(val) {
  if (!allGoogleFonts) return;
  renderFontList(allGoogleFonts, val);
}

function selectFont(val) {
  if (fontPickerCallback) {
    const btn = document.getElementById(fontPickerCallback.btnId);
    if (btn) {
      btn.textContent = val || '-- none --';
      btn.style.fontFamily = val ? `'${val}',system-ui` : '';
      if (val) loadGoogleFont(val);
    }
    fontPickerCallback.cb(val);
  }
  const overlay = document.getElementById('font-picker-overlay');
  if (overlay) overlay.remove();
}

function collapsible(title, bodyHtml, startOpen = false) {
  const id = 'coll_' + Math.random().toString(36).substr(2, 8);
  return `
    <div class="collapsible-header ${startOpen ? 'open' : ''}" onclick="this.classList.toggle('open');document.getElementById('${id}').classList.toggle('hidden')">
      <span>${title}</span><span class="arrow">&#9654;</span>
    </div>
    <div id="${id}" class="collapsible-body ${startOpen ? '' : 'hidden'}">${bodyHtml}</div>
  `;
}

// ── Screen 1: Pack Overview ──
let packSettingsTab = 'general';

function renderPackOverview(el) {
  const s = pack.strings || {};
  if (!pack.strings) pack.strings = {};
  let html = '<div style="display:flex;gap:24px;">';

  // Left: campaigns
  let left = '';
  left += '<div style="margin-bottom:16px;display:flex;gap:8px;">';
  left += '<button class="primary" onclick="createCampaign()">New Campaign</button>';
  left += '<button class="ai-btn" onclick="generateAICampaign()">Generate Campaign (AI) &#10024;</button>';
  left += '</div>';
  left += '<div class="card-grid">';
  for (const c of pack.campaigns) {
    const ow = c.overworld;
    const lvCount = ow.levels ? ow.levels.length : 0;
    left += `
      <div class="campaign-card" onclick="navigate('campaign','${c.id}')">
        <div class="card-name">${h(ow.name)}</div>
        <div class="card-desc">${h(ow.description)}</div>
        <div class="card-meta">
          <span>${lvCount} level${lvCount!==1?'s':''}</span>
        </div>
      </div>`;
  }
  left += '</div>';
  html += `<div style="flex:1;min-width:0;">${left}</div>`;

  // Right: pack settings with tabs
  html += `<div style="width:350px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;max-height:calc(100vh - 120px);display:flex;flex-direction:column;">`;
  html += `<div id="pack-settings-tabs" class="tab-bar" style="margin:0;">`;
  for (const t of [{id:'general',label:'General'},{id:'prompts',label:'Prompts'},{id:'items',label:'Items'}]) {
    html += `<button class="${packSettingsTab===t.id?'active':''}" onclick="packSettingsTab='${t.id}';refreshPackSettings()">${t.label}</button>`;
  }
  html += `</div>`;
  html += `<div id="pack-settings-body" style="padding:16px;overflow-y:auto;flex:1;">${renderPackSettingsBody(s)}</div>`;
  html += `</div>`;

  html += '</div>';
  el.innerHTML = html;
}

function renderPackSettingsBody(s) {
  if (!s) s = pack.strings || {};
  let body = '';

  if (packSettingsTab === 'general') {
    body += `<div class="form-row"><label>Title</label>${enhancedInput(s.title||'', "pack.strings.title=this.value", 'one-line game title for a roguelike dungeon pack')}</div>`;
    body += `<div class="form-row"><label>Subtitle</label>${enhancedInput(s.subtitle||'', "pack.strings.subtitle=this.value", 'one-line subtitle tagline for a roguelike game')}</div>`;
    body += `<div class="form-row-stacked"><label>Intro lines (one per line)</label>
      ${enhancedTextarea((s.intro||[]).join('\n'), "pack.strings.intro=this.value.split('\\n').filter(x=>x)", 'five-line intro narration for a roguelike game, one sentence per line', 5)}</div>`;
    body += `<div class="form-row-stacked"><label>Pack theme</label>${enhancedTextarea(pack.theme||'', "pack.theme=this.value||null", 'three-line theme description for a roguelike game pack', 3)}</div>`;
  }
  else if (packSettingsTab === 'prompts') {
    body += `<div class="form-row-stacked"><label>Campaign cleared</label>${enhancedTextarea(s.campaign_cleared||'', "pack.strings.campaign_cleared=this.value", 'congratulations message when player clears a campaign', 3)}</div>`;
    body += `<div class="form-row-stacked"><label>Campaign conquered</label>${enhancedTextarea(s.campaign_conquered||'', "pack.strings.campaign_conquered=this.value", 'message when player conquers all campaigns, use {name} for campaign name', 3)}</div>`;
    body += `<hr class="section-divider">`;
    body += `<div class="form-row-stacked"><label>First</label>${enhancedTextarea(s.prompt_first||'', "pack.strings.prompt_first=this.value", 'three-line prompt asking player to press enter to start their first game', 3)}</div>`;
    body += `<div class="form-row-stacked"><label>Next</label>${enhancedTextarea(s.prompt_next||'', "pack.strings.prompt_next=this.value", 'three-line prompt asking player to press enter for the next world', 3)}</div>`;
    body += `<div class="form-row-stacked"><label>Resume</label>${enhancedTextarea(s.prompt_resume||'', "pack.strings.prompt_resume=this.value", 'three-line prompt asking player to press enter to resume', 3)}</div>`;
    body += `<div class="form-row-stacked"><label>Restart</label>${enhancedTextarea(s.prompt_restart||'', "pack.strings.prompt_restart=this.value", 'three-line prompt asking player to press enter to play again', 3)}</div>`;
    body += `<div class="form-row-stacked"><label>After clear</label>${enhancedTextarea(s.prompt_after_clear||'', "pack.strings.prompt_after_clear=this.value", 'three-line prompt shown after clearing all campaigns', 3)}</div>`;
  }
  else if (packSettingsTab === 'items') {
    if (!pack.item_sprites) pack.item_sprites = {};
    if (!pack.item_names) pack.item_names = {};
    if (!pack.item_descriptions) pack.item_descriptions = {};
    const sprites = pack.item_sprites;
    const names = pack.item_names;
    const descs = pack.item_descriptions;
    const spriteTypes = [
      { key: 'potion', defaultName: 'Health Potion', prompt: 'a glowing healing potion bottle' },
      { key: 'speed_potion', defaultName: 'Speed Potion', prompt: 'a swirling speed potion bottle with lightning energy' },
      { key: 'bomb', defaultName: 'Bomb', prompt: 'a round bomb with a lit fuse' },
      { key: 'gold', defaultName: 'Gold', prompt: 'a pile of gold coins' },
      { key: 'key', defaultName: 'Key', prompt: 'an ornate dungeon key' },
    ];
    for (const st of spriteTypes) {
      const itemName = names[st.key] || st.defaultName;
      body += `<div style="background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;">`;
      body += `<div class="flex gap-8 items-center" style="margin-bottom:4px;">
        ${enhancedInput(itemName, "updateItemName('" + st.key + "',this.value)", 'one-line item name for a roguelike game item', 'flex:1;font-weight:600;font-size:12px;')}
        <button style="font-size:9px;padding:2px 4px;" onclick="resetItemName('${st.key}')" title="Reset to ${st.defaultName}">&#x21ba;</button>
      </div>`;
      const itemDesc = descs[st.key] || st.prompt;
      body += `<div style="margin-bottom:4px;">
        ${enhancedInput(itemDesc, "updateItemDesc('" + st.key + "',this.value)", 'one-line visual description of a game item for pixel art sprite generation — describe its appearance, shape, colors, and style', 'font-size:11px;color:#aaa;')}
      </div>`;
      body += `<div class="flex gap-8 items-center">`;
      if (sprites[st.key]) {
        body += `<img src="data:image/png;base64,${sprites[st.key]}" style="width:32px;height:32px;border-radius:4px;border:1px solid var(--border);image-rendering:pixelated;">
          <button class="ai-btn" onclick="generateItemTypeSprite('${st.key}')" style="font-size:10px;">&#10024; Regen</button>
          <button style="font-size:9px;padding:2px 4px;" onclick="clearItemTypeSprite('${st.key}')">Clear</button>`;
      } else {
        body += `<button class="ai-btn" onclick="generateItemTypeSprite('${st.key}')" style="font-size:10px;">&#10024; Sprite</button>`;
      }
      body += `</div></div>`;
    }
  }
  return body;
}

function refreshPackSettings() {
  const el = document.getElementById('pack-settings-body');
  if (el) el.innerHTML = renderPackSettingsBody();
  const tabs = document.getElementById('pack-settings-tabs');
  if (tabs) {
    tabs.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.textContent.toLowerCase() === packSettingsTab);
    });
  }
}

async function createCampaign() {
  try {
    const c = await api('POST', '/api/campaigns');
    pack.campaigns.push(c);
    navigate('campaign', c.id);
    showToast('Campaign created', 'success');
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

async function generateAICampaign() {
  const theme = prompt('Optional theme (leave blank for random):');
  if (theme === null) return;
  showToast('Generating campaign... this may take a moment', 'info');
  try {
    const ow = await api('POST', '/api/generate/overworld', { theme: theme || null });
    // Create campaign
    const c = await api('POST', '/api/campaigns');
    c.overworld = ow;
    c.designs = [];
    // Generate level designs
    for (let i = 0; i < ow.levels.length; i++) {
      const lv = ow.levels[i];
      showToast(`Generating level ${i+1}/${ow.levels.length}: ${lv.name}`, 'info');
      const design = await api('POST', '/api/generate/level-design', {
        campaign_name: ow.name,
        campaign_desc: ow.description,
        level_config: {
          title: lv.name, font: lv.font || ow.font || '', description: lv.description,
          theme: lv.theme, palette: lv.palette || [], budget: lv.budget, floor: i + 1, campaign_tier: 0
        },
        theme: theme || null
      });
      c.designs.push(design);
    }
    // Update in pack
    const idx = pack.campaigns.findIndex(x => x.id === c.id);
    if (idx >= 0) pack.campaigns[idx] = c;
    navigate('campaign', c.id);
    showToast('AI campaign generated!', 'success');
  } catch(e) { showToast('Generation failed: ' + e.message, 'error'); }
}

        ${enhancedTextarea(cm[i].description||'', "updateCampaignMonster("+i+",'description',this.value)", 'short five-line monster description for a creature called '+cm[i].name+' in a roguelike dungeon', 5)}
        <div class="flex gap-8 items-center" style="margin-top:6px;">
          ${cm[i].image

               <button class="ai-btn" onclick="generateMonsterSprite(${i})" style="font-size:11px;">&#10024; Regen</button>
               <button style="font-size:10px;padding:2px 6px;" onclick="clearMonsterSprite(${i})">Clear</button>`
            : `<div style="width:48px;height:48px;border-radius:4px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:#555;">👾</div>
               <button class="ai-btn" onclick="generateMonsterSprite(${i})">&#10024; Generate Sprite</button>`}
        </div>
      </div>`;
    }
    html += `<button onclick="addCampaignMonster();document.getElementById('left-panel').innerHTML=renderLeftPanel(getCampaign(selectedCampaignId))" style="font-size:12px;">+ Add Monster</button>`;
  }
  else if (campaignTab === 'settings') {
    const store = ow.store || {};
    const st = c.settings || {};
    html += `<h3 style="margin-bottom:8px;">Store Inventory</h3>
      <div class="form-row"><label>Healing Potions</label><input type="number" value="${store.healing_potions||0}" min="0" onchange="updateStore('healing_potions',+this.value)"></div>

      <div class="form-row"><label>Traps from level</label><input type="number" value="${st.traps_from_level||2}" min="1" max="99" onchange="updateSetting('traps_from_level',+this.value)"></div>

function updateOW(key, val) {
  const c = getCampaign(selectedCampaignId);
  c.overworld[key] = val;
  if (['bg_color','text_color','name','description','font','description_font','bg_gradient','bg_image'].includes(key)) renderDAG(c);
}
function updateGradient() {
  const c = getCampaign(selectedCampaignId);
  const panel = document.getElementById('left-panel');
  const inputs = panel.querySelectorAll('input[type="color"]');
  const range = panel.querySelector('input[type="range"]');
  if (inputs.length >= 2 && range) {
    // The gradient color pickers are the last two color inputs in the bg section
    const colors = Array.from(inputs).slice(-2);
    const grad = `linear-gradient(${range.value}deg, ${colors[0].value}, ${colors[1].value})`;
    c.overworld.bg_gradient = grad;
    const preview = document.getElementById('grad-preview');
    if (preview) preview.style.background = grad;
    // Update angle label
    const label = range.parentElement.querySelector('label');
    if (label) label.textContent = `Angle ${range.value}°`;
    renderDAG(c);
  }
}

function setBgMode(mode) {
  const c = getCampaign(selectedCampaignId);
  c.overworld._bg_mode = mode;
  if (mode === 'solid') { c.overworld.bg_gradient = null; c.overworld.bg_image = null; }
  else if (mode === 'gradient') { c.overworld.bg_image = null; if (!c.overworld.bg_gradient) c.overworld.bg_gradient = 'linear-gradient(135deg, #0a0a2e, #1a0a0a)'; }
  else if (mode === 'image') { c.overworld.bg_gradient = null; }
  renderDAG(c);
  document.getElementById('left-panel').innerHTML = renderLeftPanel(c);
}
async function enhanceBgPrompt() {
  const el = document.getElementById('bg-prompt');
  if (!el || !el.value.trim()) return;
  showToast('Enhancing prompt...', 'info');
  try {
    const r = await api('POST', '/api/generate/description', { context: 'overworld background image for roguelike game', target: 'enhance this image prompt for a dark atmospheric game background: ' + el.value });
    el.value = r.text;
    getCampaign(selectedCampaignId).overworld._bg_prompt = r.text;
    showToast('Prompt enhanced!', 'success');
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}
async function generateBgImage() {
  const el = document.getElementById('bg-prompt');
  const prompt = el ? el.value : '';
  if (!prompt.trim()) { showToast('Enter a prompt first', 'error'); return; }
  const c = getCampaign(selectedCampaignId);
  c.overworld._bg_prompt = prompt;
  showToast('Generating background...', 'info');
  try {
    const r = await api('POST', '/api/generate-image', { prompt: 'Dark atmospheric game background. ' + prompt + '. Wide landscape, no text, no UI, no characters.', width: 512, height: 256 });
    c.overworld.bg_image = r.image_base64;
    renderDAG(c);
    document.getElementById('left-panel').innerHTML = renderLeftPanel(c);
    showToast('Background generated!', 'success');
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

function updateOWFont(key, val) {
  const c = getCampaign(selectedCampaignId);
  c.overworld[key] = val || null;
  if (val) loadGoogleFont(val);
  renderDAG(c);
}
function updateSetting(key, val) {
  const c = getCampaign(selectedCampaignId);
  if (!c.settings) c.settings = {};
  c.settings[key] = val;
}
async function generateItemTypeSprite(key) {
  if (!pack.item_sprites) pack.item_sprites = {};
  const defaults = { potion: 'a glowing healing potion bottle', speed_potion: 'a swirling speed potion bottle with lightning energy', bomb: 'a round bomb with a lit fuse', gold: 'a pile of gold coins', key: 'an ornate dungeon key' };
  const desc = (pack.item_descriptions && pack.item_descriptions[key]) || defaults[key] || key;
  const prompt = `2D pixel art sprite of ${desc} for a roguelike game. ` +
    `Top-down view, 32x32 pixel art, single item centered on pure solid BLACK background (#000000). No text.`;
  showToast(`Generating ${key} sprite...`, 'info');
  try {
    const r = await api('POST', '/api/generate-image', { prompt, width: 64, height: 64 });
    const transparent = await removeBlackBackground(r.image_base64);
    const cropped = await cropToContent(transparent);
    pack.item_sprites[key] = cropped;
    refreshPackSettings();
    showToast('Sprite generated!', 'success');
  } catch(e) { showToast('Sprite failed: ' + e.message, 'error'); }
}

function clearItemTypeSprite(key) {
  if (pack.item_sprites) {
    delete pack.item_sprites[key];
    refreshPackSettings();
  }
}

function resetItemName(key) {
  if (pack.item_names) delete pack.item_names[key];
  refreshPackSettings();
}

function updateItemName(key, val) {
  if (!pack.item_names) pack.item_names = {};
  pack.item_names[key] = val;
}

function updateItemDesc(key, val) {
  if (!pack.item_descriptions) pack.item_descriptions = {};
  pack.item_descriptions[key] = val;
}

function updateStore(key, val) {
  const c = getCampaign(selectedCampaignId);
  if (!c.overworld.store) c.overworld.store = {};
  c.overworld.store[key] = val;
}
async function deleteCampaign() {
  if (!confirm('Delete this campaign?')) return;
  try {
    await api('DELETE', `/api/campaigns/${selectedCampaignId}`);
    pack.campaigns = pack.campaigns.filter(c => c.id !== selectedCampaignId);
    navigate();
    showToast('Campaign deleted', 'success');
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

// ── Connection Management ──

function getConnections(c) {
  if (c.overworld.connections) return c.overworld.connections;
  // Generate default connections from the canonical DAG shape
  return generateDefaultConnections(c);
}

function generateDefaultConnections(c) {
  const levels = c.overworld.levels || [];
  const bossLvl = c.overworld.boss_level != null ? c.overworld.boss_level : Math.min(levels.length - 1, 4);
  const conns = [];
  // Start → level 0
  if (levels.length > 0) conns.push(['start', 'level_0']);
  // Main path: 0→1→...→boss
  for (let i = 0; i < bossLvl; i++) conns.push(['level_' + i, 'level_' + (i + 1)]);
  // Boss → end
  // Boss level is the end — no separate end node
  // Branch levels chain off mid-path, ending at store
  const branchFrom = Math.min(2, bossLvl);
  const branchLevels = [];
  for (let i = 0; i < levels.length; i++) {
    if (i > bossLvl) branchLevels.push(i);
  }
  if (branchLevels.length > 0) {
    conns.push(['level_' + branchFrom, 'level_' + branchLevels[0]]);
    for (let j = 0; j < branchLevels.length - 1; j++) {
      conns.push(['level_' + branchLevels[j], 'level_' + branchLevels[j + 1]]);
    }
    conns.push(['level_' + branchLevels[branchLevels.length - 1], 'store']);
  } else {
    conns.push(['level_' + branchFrom, 'store']);
  }
  // Store as the default
  c.overworld.connections = conns;
  return conns;
}

function deleteConnection(fromId, toId) {
  const c = getCampaign(selectedCampaignId);
  if (!c.overworld.connections) getConnections(c);
  c.overworld.connections = c.overworld.connections.filter(
    ([f, t]) => !(f === fromId && t === toId)
  );
  renderDAG(c);
}

function addConnection(fromId, toId) {
  const c = getCampaign(selectedCampaignId);
  if (!c.overworld.connections) getConnections(c);
  // Don't add duplicates
  if (c.overworld.connections.some(([f, t]) => f === fromId && t === toId)) return;
  c.overworld.connections.push([fromId, toId]);
  renderDAG(c);
}

function setBossLevel(idx) {
  const c = getCampaign(selectedCampaignId);
  c.overworld.boss_level = idx;
  renderDAG(c);
}

function deleteLevel(idx) {
  if (!confirm('Delete this level?')) return;
  const c = getCampaign(selectedCampaignId);
  c.overworld.levels.splice(idx, 1);
  c.designs.splice(idx, 1);
  dagSelectedNode = null;
  // Re-index positions and connections: shift level_N → level_(N-1) for N > idx
  const pos = dagPositions[c.id] || {};
  const oldId = 'level_' + idx;
  delete pos[oldId];
  for (let i = idx; i < c.overworld.levels.length; i++) {
    pos['level_' + i] = pos['level_' + (i + 1)] || { x: 60 + (i+1) * 150, y: 180 };
    delete pos['level_' + (i + 1)];
  }
  // Fix connections referencing old indices
  if (c.overworld.connections) {
    const remap = (id) => {
      if (id === oldId) return null;
      if (id.startsWith('level_')) {
        const n = parseInt(id.split('_')[1]);
        if (n > idx) return 'level_' + (n - 1);
      }
      return id;
    };
    c.overworld.connections = c.overworld.connections
      .map(([f, t]) => [remap(f), remap(t)])
      .filter(([f, t]) => f && t);
  }
  // Fix boss_level
  if (c.overworld.boss_level != null) {
    if (c.overworld.boss_level === idx) c.overworld.boss_level = null;
    else if (c.overworld.boss_level > idx) c.overworld.boss_level--;
  }
  render();
}

// ── DAG Editor ──
function renderDAGToolbar() {
  return `
    <button onclick="autoLayout()">Auto Layout</button>
    <span style="font-size:11px;color:#666;margin-left:8px;">Drag handle → node to connect &bull; Drag handle → empty to create level &bull; Click line to delete</span>`;
}

function initDagPositions(c) {
  const levels = c.overworld.levels || [];
  const key = c.id;
  // Load from saved data if we don't have positions in memory
  if (!dagPositions[key] && c.overworld.node_positions) {
    dagPositions[key] = JSON.parse(JSON.stringify(c.overworld.node_positions));
  }
  if (!dagPositions[key]) dagPositions[key] = {};
  const pos = dagPositions[key];
  let needsLayout = false;
  for (let i = 0; i < levels.length; i++) {
    if (!pos['level_' + i]) { needsLayout = true; break; }
  }
  if (!pos['start']) needsLayout = true;
  if (!pos['store']) needsLayout = true;
  if (needsLayout) autoLayoutPositions(c, 'horizontal');
}

function saveDagPositions(c) {
  const key = c.id;
  if (dagPositions[key]) {
    c.overworld.node_positions = JSON.parse(JSON.stringify(dagPositions[key]));
  }
}

let layoutMode = 0;
const LAYOUT_MODES = ['horizontal', 'arc', 'zigzag', 'diagonal', 'compact', 'staircase'];

function autoLayoutPositions(c, mode) {
  const levels = c.overworld.levels || [];
  const key = c.id;
  dagPositions[key] = {};
  const pos = dagPositions[key];
  const bossLvl = c.overworld.boss_level != null ? c.overworld.boss_level : Math.min(levels.length - 1, 4);
  const gapX = 150, gapY = 90;
  const mainLevels = []; // indices on main path
  const branchLevels = [];
  for (let i = 0; i < levels.length; i++) {
    if (i <= bossLvl) mainLevels.push(i); else branchLevels.push(i);
  }
  // All nodes in order: start, main levels, end, branch levels, store
  const allIds = ['start', ...mainLevels.map(i => 'level_'+i)];
  const sideIds = [...branchLevels.map(i => 'level_'+i), 'store'];

  if (mode === 'horizontal') {
    const y = 180;
    allIds.forEach((id, i) => { pos[id] = { x: 60 + i * gapX, y }; });
    const bx = 60 + (Math.min(2, bossLvl) + 1) * gapX;
    sideIds.forEach((id, i) => { pos[id] = { x: bx + i * gapX, y: y + gapY }; });
  }
  else if (mode === 'arc') {
    const cx = 60 + allIds.length * gapX / 2, cy = 280;
    allIds.forEach((id, i) => {
      const t = i / Math.max(allIds.length - 1, 1);
      const ang = Math.PI + t * Math.PI;
      const rx = allIds.length * gapX / 2.2, ry = 120;
      pos[id] = { x: cx + Math.cos(ang) * rx - 60, y: cy + Math.sin(ang) * ry - 25 };
    });
    sideIds.forEach((id, i) => { pos[id] = { x: cx - 60 + i * gapX, y: cy + 80 }; });
  }
  else if (mode === 'zigzag') {
    allIds.forEach((id, i) => {
      pos[id] = { x: 60 + i * gapX, y: 150 + (i % 2) * 80 };
    });
    const bx = 60 + (Math.min(2, bossLvl) + 1) * gapX;
    sideIds.forEach((id, i) => { pos[id] = { x: bx + i * gapX, y: 150 + 80 + gapY }; });
  }
  else if (mode === 'compact') {
    // 2-row grid: main path wraps into two rows, side branch hangs below
    const perRow = Math.ceil(allIds.length / 2);
    allIds.forEach((id, i) => {
      const row = Math.floor(i / perRow);
      const col = row === 0 ? i : (perRow - 1 - (i - perRow)); // reverse on row 2
      pos[id] = { x: 60 + col * gapX, y: 120 + row * (gapY + 10) };
    });
    sideIds.forEach((id, i) => { pos[id] = { x: 60 + i * gapX, y: 120 + 2 * (gapY + 10) + 20 }; });
  }
  else if (mode === 'staircase') {
    // Staircase: main path descends in steps, side branch goes right from mid
    allIds.forEach((id, i) => {
      pos[id] = { x: 60 + i * 120, y: 80 + i * 35 };
    });
    const mid = Math.min(2, allIds.length - 1);
    const bx = 60 + mid * 120 + gapX;
    const by = 80 + mid * 35;
    sideIds.forEach((id, i) => { pos[id] = { x: bx + i * gapX, y: by }; });
  }
  else if (mode === 'diagonal') {
    allIds.forEach((id, i) => {
      pos[id] = { x: 60 + i * 130, y: 60 + i * 45 };
    });
    const bx = 60 + (Math.min(2, bossLvl) + 1) * 130;
    const by = 60 + (Math.min(2, bossLvl) + 1) * 45;
    sideIds.forEach((id, i) => { pos[id] = { x: bx + 80 + i * 130, y: by + 80 + i * 45 }; });
  }
}

function autoLayout() {
  const c = getCampaign(selectedCampaignId);
  layoutMode = (layoutMode + 1) % LAYOUT_MODES.length;
  autoLayoutPositions(c, LAYOUT_MODES[layoutMode]);
  saveDagPositions(c);
  renderDAG(c);
  showToast(`Layout: ${LAYOUT_MODES[layoutMode]}`, 'info');
}

function renderDAG(c) {
  const container = document.getElementById('dag-container');
  if (!container) return;
  initDagPositions(c);
  const levels = c.overworld.levels || [];
  const pos = dagPositions[c.id] || {};
  // Compute bounding box for SVG size
  let maxX = 0, maxY = 0;
  for (const k in pos) {
    if (pos[k].x + 120 > maxX) maxX = pos[k].x + 120;
    if (pos[k].y + 50 > maxY) maxY = pos[k].y + 50;
  }
  const W = maxX + 40;
  const H = Math.max(300, maxY + 80);

  let svg = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" id="dag-svg">`;
  svg += `<defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 3, 0 6" fill="rgba(255,255,255,.7)"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e94560" flood-opacity="0.5"/></filter>
    <filter id="glow-accent" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e94560" flood-opacity="0.6"/></filter>
  </defs>`;

  // Node sizes vary: start/end = 100x44, store = 120x44, levels = 120x50
  const nodeSize = (id) => {
    if (id === 'start') return [100, 44];
    if (id === 'store') return [120, 44];
    return [120, 50];
  };
  const nodeHandlesFor = (id, n) => {
    const [nw, nh] = nodeSize(id);
    return [
      { x: n.x + nw/2, y: n.y },
      { x: n.x + nw, y: n.y + nh/2 },
      { x: n.x + nw/2, y: n.y + nh },
      { x: n.x, y: n.y + nh/2 },
    ];
  };
  // Each handle knows its direction: which way the control point should extend
  const outputHandles = (id, n) => {
    const [nw, nh] = nodeSize(id);
    return [
      { x: n.x + nw, y: n.y + nh/2, dx: 1, dy: 0 },   // right
      { x: n.x + nw/2, y: n.y + nh, dx: 0, dy: 1 },    // bottom
    ];
  };
  const inputHandles = (id, n) => {
    const [nw, nh] = nodeSize(id);
    return [
      { x: n.x, y: n.y + nh/2, dx: -1, dy: 0 },        // left
      { x: n.x + nw/2, y: n.y, dx: 0, dy: -1 },         // top
    ];
  };
  const closestHandles = (fromId, toId, from, to) => {
    const outs = outputHandles(fromId, from);
    const ins = inputHandles(toId, to);
    let best = null, bestDist = Infinity;
    for (const f of outs) {
      for (const t of ins) {
        const d = (f.x - t.x) ** 2 + (f.y - t.y) ** 2;
        if (d < bestDist) { bestDist = d; best = { fx: f.x, fy: f.y, fdx: f.dx, fdy: f.dy, tx: t.x, ty: t.y, tdx: t.dx, tdy: t.dy }; }
      }
    }
    return best;
  };
  const bezierCP = (h) => {
    // Control points extend in the handle's facing direction, guaranteeing the curve routes away from the node
    const dist = Math.sqrt((h.tx - h.fx) ** 2 + (h.ty - h.fy) ** 2);
    const off = Math.max(50, dist * 0.4);
    return {
      cx1: h.fx + h.fdx * off,
      cy1: h.fy + h.fdy * off,
      cx2: h.tx + h.tdx * off,
      cy2: h.ty + h.tdy * off,
    };
  };
  const drawLine = (fromId, toId) => {
    const from = pos[fromId], to = pos[toId];
    if (!from || !to) return '';
    const h = closestHandles(fromId, toId, from, to);
    if (!h) return '';
    const cp = bezierCP(h);
    return `<path class="conn-visible" d="M${h.fx},${h.fy} C${cp.cx1},${cp.cy1} ${cp.cx2},${cp.cy2} ${h.tx},${h.ty}" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>`;
  };
  const drawConnection = (fromId, toId) => {
    const from = pos[fromId], to = pos[toId];
    if (!from || !to) return '';
    const h = closestHandles(fromId, toId, from, to);
    if (!h) return '';
    const cp = bezierCP(h);
    const d = `M${h.fx},${h.fy} C${cp.cx1},${cp.cy1} ${cp.cx2},${cp.cy2} ${h.tx},${h.ty}`;
    return `<g class="conn-group" style="cursor:pointer" onclick="deleteConnection('${fromId}','${toId}')">
      <path d="${d}" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="4" stroke-linecap="round"/>
      <path class="conn-visible" d="${d}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <path d="${d}" fill="none" stroke="transparent" stroke-width="14"/>
    </g>`;
  };

  // Use stored connections, or generate defaults
  const conns = getConnections(c);
  for (const [from, to] of conns) {
    svg += drawConnection(from, to);
  }

  // Connection handles: 4 per node (top, right, bottom, left)
  const handles = (nodeId, px, py, nw, nh) => {
    nw = nw || 120; nh = nh || 50;
    const pts = [
      [px + nw/2, py, nodeId],       // top center
      [px + nw, py + nh/2, nodeId],  // right center
      [px + nw/2, py + nh, nodeId],  // bottom center
      [px, py + nh/2, nodeId],       // left center
    ];
    return pts.map(([cx, cy, id]) =>
      `<circle cx="${cx}" cy="${cy}" r="4" fill="rgba(255,255,255,.15)" stroke="rgba(255,255,255,.4)" stroke-width="1" class="conn-handle" style="cursor:crosshair" onmousedown="event.stopPropagation();startConnDrag(event,'${id}')"/>`
    ).join('');
  };

  // Start node
  const sp = pos['start'] || { x: 60, y: 180 };
  svg += `<g class="dag-node" data-id="start" onmousedown="dagMouseDown(event,'start')" filter="url(#shadow)">
    <rect x="${sp.x}" y="${sp.y}" width="100" height="44" rx="22" fill="#2e7d32" stroke="rgba(76,175,80,.4)" stroke-width="1.5"/>
    <text x="${sp.x+50}" y="${sp.y+27}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" letter-spacing="1">START</text>
    ${handles('start', sp.x, sp.y, 100, 44)}</g>`;

  // Level nodes
  for (let i = 0; i < levels.length; i++) {
    const lv = levels[i];
    const p = pos['level_' + i] || { x: 200 + i * 140, y: 180 };
    const fill = lv.palette && lv.palette[0] ? lv.palette[0] : (lv.color || '#0f3460');
    const bossIdx = c.overworld.boss_level != null ? c.overworld.boss_level : Math.min(levels.length - 1, 4);
    const isFinalBoss = i === bossIdx;
    const isSelected = dagSelectedNode === i;
    const strokeCol = isFinalBoss ? '#e94560' : 'rgba(255,255,255,.12)';
    const strokeW = isFinalBoss ? 2.5 : (isSelected ? 2.5 : 1);
    const selStroke = isSelected ? '#e94560' : strokeCol;
    const nodeFilter = isSelected ? 'filter="url(#glow-accent)"' : (isFinalBoss ? 'filter="url(#glow-red)"' : 'filter="url(#shadow)"');
    svg += `<g class="dag-node ${isSelected ? 'selected' : ''}" data-id="level_${i}"
      onmousedown="dagMouseDown(event,'level_${i}')" ${nodeFilter}>
      <rect x="${p.x}" y="${p.y}" width="120" height="50" rx="12" fill="${h(fill)}" stroke="${selStroke}" stroke-width="${strokeW}"/>
      <rect x="${p.x}" y="${p.y}" width="120" height="24" rx="12" fill="rgba(255,255,255,.06)"/>
      <text x="${p.x+60}" y="${p.y+19}" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" letter-spacing="0.3">${h(lv.name||'Level '+(i+1))}</text>
      <rect x="${p.x+8}" y="${p.y+28}" width="34" height="16" rx="8" fill="rgba(255,255,255,.1)"/>
      <text x="${p.x+25}" y="${p.y+39}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="8" font-weight="600">Lvl ${i+1}</text>
      <rect x="${p.x+78}" y="${p.y+28}" width="34" height="16" rx="8" fill="rgba(255,255,255,.1)"/>
      <text x="${p.x+95}" y="${p.y+39}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="8" font-weight="600">${lv.budget||0}$</text>
      ${handles('level_'+i, p.x, p.y)}</g>`;
  }

  // Store node
  const stp = pos['store'] || { x: 800, y: 110 };
  svg += `<g class="dag-node" data-id="store" onmousedown="dagMouseDown(event,'store')" filter="url(#shadow)">
    <rect x="${stp.x}" y="${stp.y}" width="120" height="44" rx="22" fill="#5d4e37" stroke="rgba(255,215,0,.3)" stroke-width="1.5"/>
    <text x="${stp.x+60}" y="${stp.y+27}" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="700" letter-spacing="1">STORE</text>
    ${handles('store', stp.x, stp.y, 120, 44)}</g>`;

  // No END node — boss level is the end

  svg += '</svg>';

  // Node popup for selected level
  let popup = '';
  if (dagSelectedNode !== null && dagSelectedNode < levels.length) {
    const lv = levels[dagSelectedNode];
    const nodePos = pos['level_' + dagSelectedNode];
    if (nodePos) {
      const px = nodePos.x + 60; // center-aligned with node
      const py = nodePos.y + 50; // flush with node bottom
      const isBoss = (c.overworld.boss_level != null ? c.overworld.boss_level : Math.min(levels.length-1, 4)) === dagSelectedNode;
      popup = `<div class="dag-popup" style="left:${px}px;top:${py}px;">
        <div style="display:flex;gap:3px;align-items:center;">
          <span style="font-size:11px;color:#888;">$</span>
          <input type="number" value="${lv.budget||0}" min="0" max="999" style="width:44px;font-size:11px;padding:1px 3px;"
            onchange="updateLevel(${dagSelectedNode},'budget',+this.value);renderDAG(getCampaign(selectedCampaignId))">
          <button style="font-size:8px;padding:1px 4px;line-height:1;${isBoss?'background:var(--accent);border-color:var(--accent);':''}" onclick="setBossLevel(${dagSelectedNode})" title="Boss">${isBoss?'&#9733;':'&#9734;'}</button>
          <button class="danger" style="font-size:8px;padding:1px 4px;line-height:1;" onclick="deleteLevel(${dagSelectedNode})" title="Delete">&#10005;</button>
        </div>
      </div>`;
    }
  }

  // Title header + live bg/text color
  const ow = c.overworld;
  const bg = ow.bg_color || '#0d0d1e';
  const tc = ow.text_color || '#e8e8e8';
  const titleFont = ow.font ? `font-family:'${ow.font}',system-ui` : '';
  const descFont = ow.description_font ? `font-family:'${ow.description_font}',system-ui` : '';
  if (ow.font) loadGoogleFont(ow.font);
  if (ow.description_font) loadGoogleFont(ow.description_font);
  if (ow.bg_image) {
    container.style.background = `url('data:image/png;base64,${ow.bg_image}') center/cover no-repeat`;
  } else if (ow.bg_gradient) {
    container.style.background = ow.bg_gradient;
  } else {
    container.style.background = bg;
  }

  const header = `<div class="dag-header">
    <h2 style="${titleFont};color:${tc};font-size:24px;">${h(ow.name)}</h2>
    <p style="${descFont};color:${tc}">${h(ow.description)}</p>
  </div>`;

  container.innerHTML = header + `<div style="position:relative;display:flex;justify-content:center;"><div style="position:relative;">` + svg + popup + `</div></div>`;

  // Attach drag handlers
  const svgEl = document.getElementById('dag-svg');
  svgEl.addEventListener('mousemove', dagMouseMove);
  svgEl.addEventListener('mouseup', dagMouseUp);
  svgEl.addEventListener('mouseleave', dagMouseUp);
  // Click blank canvas to deselect
  svgEl.addEventListener('click', (e) => {
    if (e.target === svgEl || e.target.tagName === 'svg') {
      dagSelectedNode = null;
      renderDAG(c);
    }
  });
}

function dagMouseDown(e, nodeId) {
  e.preventDefault();
  const c = getCampaign(selectedCampaignId);
  const pos = dagPositions[c.id] || {};
  const p = pos[nodeId];
  if (!p) return;

  if (addConnectionMode) {
    if (!connectionSource) {
      connectionSource = nodeId;
      document.getElementById('dag-status').textContent = 'Click target node...';
    } else {
      addConnectionMode = false;
      connectionSource = null;
      document.getElementById('conn-btn').style.background = '';
      document.getElementById('dag-status').textContent = '';
    }
    return;
  }

  // Double-click detection: if same node clicked twice within 400ms, open level editor
  if (nodeId.startsWith('level_')) {
    if (dagClickNodeId === nodeId && dagClickTimer) {
      // Double click detected
      clearTimeout(dagClickTimer);
      dagClickTimer = null;
      dagClickNodeId = null;
      const idx = parseInt(nodeId.split('_')[1]);
      selectLevel(idx);
      return;
    }
    // First click — highlight and wait for possible second click
    dagClickNodeId = nodeId;
    if (dagClickTimer) clearTimeout(dagClickTimer);
    dagClickTimer = setTimeout(() => {
      dagClickTimer = null;
      dagClickNodeId = null;
    }, 400);
    const idx = parseInt(nodeId.split('_')[1]);
    dagSelectedNode = idx;
  }

  // Re-render DAG to show popup on selected node
  if (!dagDragMoved) renderDAG(c);

  // Start drag tracking (won't actually move unless mouse moves)
  const svg = document.getElementById('dag-svg');
  const pt = svg.getBoundingClientRect();
  dagDragging = nodeId;
  dagDragOffset = { x: e.clientX - pt.left - p.x, y: e.clientY - pt.top - p.y };
  dagDragMoved = false;
}

let dagConnecting = false;
let connDragSource = null;
let connDragStart = null; // {x,y} of the handle we started from

function startConnDrag(e, nodeId) {
  e.stopPropagation();
  e.preventDefault();
  connDragSource = nodeId;
  // Capture the handle position from the clicked circle
  const circle = e.target;
  connDragStart = { x: parseFloat(circle.getAttribute('cx')), y: parseFloat(circle.getAttribute('cy')) };
  const svg = document.getElementById('dag-svg');
  if (svg) {
    svg.addEventListener('mousemove', connDragMove);
    svg.addEventListener('mouseup', connDragEnd);
    svg.addEventListener('mouseleave', connDragEnd);
  }
}

function connDragMove(e) {
  if (!connDragSource) return;
  const svg = document.getElementById('dag-svg');
  if (!svg) return;
  // Remove old temp line
  const old = document.getElementById('conn-temp-line');
  if (old) old.remove();
  const c = getCampaign(selectedCampaignId);
  const pos = dagPositions[c.id] || {};
  const fromPos = pos[connDragSource];
  if (!fromPos) return;
  const container = document.getElementById('dag-container');
  const pt = svg.getBoundingClientRect();
  const scrollX = container ? container.scrollLeft : 0;
  const scrollY = container ? container.scrollTop : 0;
  const mx = e.clientX - pt.left + scrollX, my = e.clientY - pt.top + scrollY;
  const fx = connDragStart ? connDragStart.x : fromPos.x + 60;
  const fy = connDragStart ? connDragStart.y : fromPos.y + 25;
  const dx = Math.abs(mx - fx), dy = Math.abs(my - fy);
  const off = Math.max(dx, dy) * 0.5;
  const cx1 = dx >= dy ? fx + (mx > fx ? off : -off) : fx;
  const cy1 = dx >= dy ? fy : fy + (my > fy ? off : -off);
  const cx2 = dx >= dy ? mx - (mx > fx ? off : -off) : mx;
  const cy2 = dx >= dy ? my : my - (my > fy ? off : -off);
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('id', 'conn-temp-line');
  path.setAttribute('d', `M${fx},${fy} C${cx1},${cy1} ${cx2},${cy2} ${mx},${my}`);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#e94560');
  path.setAttribute('stroke-width', '2');
  path.setAttribute('stroke-dasharray', '6,4');
  svg.appendChild(path);
}

function connDragEnd(e) {
  const old = document.getElementById('conn-temp-line');
  if (old) old.remove();
  if (connDragSource && e) {
    const svg = document.getElementById('dag-svg');
    const c = getCampaign(selectedCampaignId);
    const pos = dagPositions[c.id] || {};
    if (svg) {
      const container = document.getElementById('dag-container');
      const pt = svg.getBoundingClientRect();
      const scrollX = container ? container.scrollLeft : 0;
      const scrollY = container ? container.scrollTop : 0;
      const mx = e.clientX - pt.left + scrollX, my = e.clientY - pt.top + scrollY;
      // Check if dropped on an existing node (with generous 20px padding)
      let hitNode = null;
      let bestDist = Infinity;
      for (const nodeId in pos) {
        if (nodeId === connDragSource) continue;
        const p = pos[nodeId];
        const cx = p.x + 60, cy = p.y + 25;
        const dist = Math.sqrt((mx - cx) ** 2 + (my - cy) ** 2);
        if (dist < 80 && dist < bestDist) {
          bestDist = dist;
          hitNode = nodeId;
        }
      }
      if (hitNode) {
        addConnection(connDragSource, hitNode);
      } else if (mx > 0 && my > 0) {
        // Dropped on blank canvas — create a new level here
        const newIdx = c.overworld.levels.length;
        c.overworld.levels.push({
          name: 'New Level', font: null, description: '', theme: '',
          color: null, palette: ['#444444', '#666666', '#888888'], budget: 150
        });
        // Ensure matching design
        while (c.designs.length < c.overworld.levels.length) {
          c.designs.push({
            tile_defs: [{ name: 'wall', char: '#' }, { name: 'floor', char: '.' }],
            boss: { name: '', hp: 0, attack: 0, defense: 0, xp_value: 0, description: '' },
            monster_types: [], weapon: { name: '', description: '' },
            armor: { name: '', description: '' }, traps: [],
            mode: { root: 'C', scale: 'aeolian' },
            victory_message: '', defeat_message: '', budget_spent: null
          });
        }
        const newId = 'level_' + newIdx;
        pos[newId] = { x: mx - 60, y: my - 25 };
        // Connect from source to new node
        if (!c.overworld.connections) getConnections(c);
        c.overworld.connections.push([connDragSource, newId]);
        renderDAG(c);
      }
      svg.removeEventListener('mousemove', connDragMove);
      svg.removeEventListener('mouseup', connDragEnd);
      svg.removeEventListener('mouseleave', connDragEnd);
    }
  }
  connDragSource = null;
}

function dagMouseMove(e) {
  if (!dagDragging) return;
  dagDragMoved = true;
  const c = getCampaign(selectedCampaignId);
  const svg = document.getElementById('dag-svg');

  dagPositions[c.id][dagDragging] = { x: Math.max(0, x), y: Math.max(0, y) };
  saveDagPositions(c);
  renderDAG(c);
}

const ENTITY_COSTS = {
  monster: 6,   // avg of 5-8
  trap: 5,      // avg of 3-8
  gold: 3,      // avg of 2-5
  potion: 0,    // free
  weapon: 0,    // free
  armor: 0,     // free
  key: 0,       // free

  bomb: 0,
};

function calcBudgetSpent(pe, levelIdx) {
  let spent = 0;
  // Boss: ~20% of budget
  const c = getCampaign(selectedCampaignId);
  const lv = c?.overworld?.levels?.[levelIdx];
  const budget = lv?.budget || 0;
  spent += Math.round(budget * 0.20); // boss always costs ~20%
  spent += (pe.monsters?.length || 0) * ENTITY_COSTS.monster;
  spent += (pe.traps?.length || 0) * ENTITY_COSTS.trap;
  for (const it of (pe.items || [])) {
    spent += ENTITY_COSTS[it.item_type] || 3;
  }
  return spent;
}

async function generateMonsterSprite(i) {
  const c = getCampaign(selectedCampaignId);
  const m = c.monster_templates && c.monster_templates[i];
  if (!m) return;
  const desc = m.description || '';
  const prompt = `2D pixel art sprite of a roguelike game monster called "${m.name}". ${desc}. ` +
    `Top-down view, 32x32 pixel art, single creature centered on a pure solid BLACK background (#000000). ` +
    `Simple, readable silhouette. Bright colorful creature on BLACK. No text, no UI, no ground, no shadows.`;
  showToast('Generating sprite...', 'info');
  try {
    const r = await api('POST', '/api/generate-image', { prompt, width: 64, height: 64 });
    const transparent = await removeBlackBackground(r.image_base64);
    const cropped = await cropToContent(transparent);
    m.image = cropped;
    document.getElementById('left-panel').innerHTML = renderLeftPanel(c);
    showToast('Sprite generated!', 'success');
  } catch(e) { showToast('Sprite failed: ' + e.message, 'error'); }
}

function removeBlackBackground(b64) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, c.width, c.height);
      const px = data.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i+1], b = px[i+2];
        const brightness = (r + g + b) / 3;
        if (brightness < 30) {
          // Near-black → fully transparent
          px[i+3] = 0;
        } else if (brightness < 60) {
          // Dark → fade to transparent (smooth edge)
          px[i+3] = Math.round((brightness - 30) / 30 * 255);
        }
        // else: keep as-is
      }
      ctx.putImageData(data, 0, 0);
      resolve(c.toDataURL('image/png').split(',')[1]);
    };
    img.onerror = () => resolve(b64);
    img.src = 'data:image/png;base64,' + b64;
  });
}

function cropToContent(b64) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, c.width, c.height);
      const px = data.data;
      let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
      for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
          const a = px[(y * c.width + x) * 4 + 3];
          if (a > 10) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX <= minX || maxY <= minY) { resolve(b64); return; }
      // Add 1px padding
      minX = Math.max(0, minX - 1);
      minY = Math.max(0, minY - 1);
      maxX = Math.min(c.width - 1, maxX + 1);
      maxY = Math.min(c.height - 1, maxY + 1);
      const cw = maxX - minX + 1, ch = maxY - minY + 1;
      // Make it square (use the larger dimension)
      const size = Math.max(cw, ch);
      const out = document.createElement('canvas');
      out.width = size;
      out.height = size;
      const octx = out.getContext('2d');
      octx.drawImage(c, minX, minY, cw, ch, (size - cw) / 2, (size - ch) / 2, cw, ch);
      resolve(out.toDataURL('image/png').split(',')[1]);
    };
    img.onerror = () => resolve(b64);
    img.src = 'data:image/png;base64,' + b64;
  });
}

function dominantColor(b64, cb) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, c.width, c.height).data;
    let tr = 0, tg = 0, tb = 0, count = 0;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i+3] > 30) { // skip transparent
        tr += data[i]; tg += data[i+1]; tb += data[i+2]; count++;
      }
    }
    if (count === 0) { cb('#555555'); return; }
    const r = Math.round(tr/count), g = Math.round(tg/count), b = Math.round(tb/count);
    cb('#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join(''));
  };
  img.onerror = () => cb('#555555');
  img.src = 'data:image/png;base64,' + b64;
}

async function generateTileImage(levelIdx, tileIdx) {
  const c = getCampaign(selectedCampaignId);
  const d = ensureDesign(levelIdx);
  const lv = c.overworld.levels[levelIdx];
  const td = d.tile_defs[tileIdx];
  const isWall = tileIdx === 0;
  const pal = lv.palette || [];
  const col = pal[tileIdx] || '#333';

  const prompt = `Generate a single square tile texture for a top-down 2D roguelike game. ` +
    `The tile is: "${td.name}". ${isWall ? 'It is a solid wall or obstacle — should look dense and impassable.' : 'It is a walkable floor tile — should look open and traversable.'} ` +
    `The level theme is: "${lv.theme || 'dungeon'}". ` +
    `STYLE REQUIREMENTS: Simple flat pixel art. Use color ${col} as the dominant color. ` +
    `Bright and saturated, NOT dark or muddy. Minimal detail — just enough to suggest the material. ` +
    `Perfectly seamless and tileable in all directions. Uniform texture with NO focal point, NO objects, NO borders, NO text. ` +
    `Think classic SNES/GBA RPG tile. Fill the ENTIRE image with the texture edge to edge.`;

  showToast('Generating tile image...', 'info');
  try {
    const r = await api('POST', '/api/generate-image', { prompt, width: 64, height: 64 });
    const blended = await blendWithColor(r.image_base64, col, 0.45);
    d.tile_defs[tileIdx].image = blended;
    refreshLevelEditor();
    showToast('Tile image generated!', 'success');
  } catch (e) {
    showToast('Image generation failed: ' + e.message, 'error');
  }
}

// Blend a base64 image with a solid color. strength=0 is original, strength=1 is solid color.
function blendWithColor(b64, hexColor, strength) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      // Draw original
      ctx.drawImage(img, 0, 0);
      // Overlay solid color with opacity = strength
      ctx.globalAlpha = strength;
      ctx.fillStyle = hexColor;
      ctx.fillRect(0, 0, c.width, c.height);
      // Extract as base64 (strip data URL prefix)
      const dataUrl = c.toDataURL('image/png');
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = () => resolve(b64); // fallback to original on error
    img.src = 'data:image/png;base64,' + b64;
  });
}
