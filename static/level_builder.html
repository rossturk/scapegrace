// ── Connection Management ──

function getConnections(c) {
  if (c.overworld.connections) return c.overworld.connections;
  // Generate default connections from the canonical DAG shape
  return generateDefaultConnections(c);
}

function generateDefaultConnections(c) {
  const levels = c.overworld.levels || [];
  const bossLvl = c.overworld.boss_level != null ? c.overworld.boss_level : Math.min(levels.length - 1, 4);
  const conns = [];
  // Start → level 0
  if (levels.length > 0) conns.push(['start', 'level_0']);
  // Main path: 0→1→...→boss
  for (let i = 0; i < bossLvl; i++) conns.push(['level_' + i, 'level_' + (i + 1)]);
  // Boss → end
  // Boss level is the end — no separate end node
  // Branch levels chain off mid-path, ending at store
  const branchFrom = Math.min(2, bossLvl);
  const branchLevels = [];
  for (let i = 0; i < levels.length; i++) {
    if (i > bossLvl) branchLevels.push(i);
  }
  if (branchLevels.length > 0) {
    conns.push(['level_' + branchFrom, 'level_' + branchLevels[0]]);
    for (let j = 0; j < branchLevels.length - 1; j++) {
      conns.push(['level_' + branchLevels[j], 'level_' + branchLevels[j + 1]]);
    }
    conns.push(['level_' + branchLevels[branchLevels.length - 1], 'store']);
  } else {
    conns.push(['level_' + branchFrom, 'store']);
  }
  // Store as the default
  c.overworld.connections = conns;
  return conns;
}

function deleteConnection(fromId, toId) {
  const c = getCampaign(selectedCampaignId);
  if (!c.overworld.connections) getConnections(c);
  c.overworld.connections = c.overworld.connections.filter(
    ([f, t]) => !(f === fromId && t === toId)
  );
  renderDAG(c);
}

function addConnection(fromId, toId) {
  const c = getCampaign(selectedCampaignId);
  if (!c.overworld.connections) getConnections(c);
  // Don't add duplicates
  if (c.overworld.connections.some(([f, t]) => f === fromId && t === toId)) return;
  c.overworld.connections.push([fromId, toId]);
  renderDAG(c);
}

function setBossLevel(idx) {
  const c = getCampaign(selectedCampaignId);
  c.overworld.boss_level = idx;
  renderDAG(c);
}

function deleteLevel(idx) {
  if (!confirm('Delete this level?')) return;
  const c = getCampaign(selectedCampaignId);
  c.overworld.levels.splice(idx, 1);
  c.designs.splice(idx, 1);
  dagSelectedNode = null;
  // Re-index positions and connections: shift level_N → level_(N-1) for N > idx
  const pos = dagPositions[c.id] || {};
  const oldId = 'level_' + idx;
  delete pos[oldId];
  for (let i = idx; i < c.overworld.levels.length; i++) {
    pos['level_' + i] = pos['level_' + (i + 1)] || { x: 60 + (i+1) * 150, y: 180 };
    delete pos['level_' + (i + 1)];
  }
  // Fix connections referencing old indices
  if (c.overworld.connections) {
    const remap = (id) => {
      if (id === oldId) return null;
      if (id.startsWith('level_')) {
        const n = parseInt(id.split('_')[1]);
        if (n > idx) return 'level_' + (n - 1);
      }
      return id;
    };
    c.overworld.connections = c.overworld.connections
      .map(([f, t]) => [remap(f), remap(t)])
      .filter(([f, t]) => f && t);
  }
  // Fix boss_level
  if (c.overworld.boss_level != null) {
    if (c.overworld.boss_level === idx) c.overworld.boss_level = null;
    else if (c.overworld.boss_level > idx) c.overworld.boss_level--;
  }
  render();
}

// ── DAG Editor ──
function renderDAGToolbar() {

    <button onclick="autoLayout()">Auto Layout</button>

    <button onclick="owZoom1to1()" style="margin-left:8px;">1:1</button>
    <button onclick="owZoomFit()">Fit</button>

// Fixed viewBox — all positions stored in this coordinate space
const VB_W = 1600, VB_H = 900;

function initDagPositions(c) {
  const levels = c.overworld.levels || [];
  const key = c.id;
  if (!dagPositions[key] && c.overworld.node_positions) {
    // Load saved 0..1 positions, scale to viewBox coords
    const saved = c.overworld.node_positions;
    dagPositions[key] = {};
    for (const k in saved) {
      const p = saved[k];
      // Detect old pixel-coord format (values > 2 are clearly not 0..1)
      const isNormalized = p.x <= 2 && p.y <= 2;
      dagPositions[key][k] = {
        x: isNormalized ? p.x * VB_W : p.x,
        y: isNormalized ? p.y * VB_H : p.y,
      };
    }
  }
  if (!dagPositions[key]) dagPositions[key] = {};
  const pos = dagPositions[key];
  let needsLayout = false;
  for (let i = 0; i < levels.length; i++) {
    if (!pos['level_' + i]) { needsLayout = true; break; }
  }
  if (!pos['start']) needsLayout = true;
  if (!pos['store']) needsLayout = true;
  if (needsLayout) autoLayoutPositions(c, 'horizontal');
  if (!pos['title']) pos['title'] = { x: VB_W / 2 - 300, y: 20 };
  if (!pos['desc']) pos['desc'] = { x: VB_W / 2 - 400, y: 110 };
  // Restore text box sizes/font sizes from saved data (only on first load)
  if (!c.overworld._title_initialized) {
    const np = c.overworld.node_positions || {};
    for (const id of ['title', 'desc']) {
      const s = np[id];
      if (!s) continue;
      if (s.font_size) c.overworld['_'+id+'_font_size'] = s.font_size;
      if (s.w) c.overworld['_'+id+'_w'] = s.w * VB_W;
      if (s.h) c.overworld['_'+id+'_h'] = s.h * VB_H;
    }
    c.overworld._title_initialized = true;
  }
}

function saveDagPositions(c) {
  const key = c.id;
  if (!dagPositions[key]) return;
  // Save as 0..1 normalized coordinates
  const out = {};
  for (const k in dagPositions[key]) {
    const p = dagPositions[key][k];
    out[k] = { x: p.x / VB_W, y: p.y / VB_H };
  }
  // Include text box font sizes and dimensions
  const ow = c.overworld;
  for (const id of ['title', 'desc']) {
    if (out[id]) {
      const defW = id === 'title' ? 600 : 800;
      const defH = id === 'title' ? 80 : 60;
      const defFs = id === 'title' ? 36 : 14;
      out[id].font_size = ow['_'+id+'_font_size'] || defFs;
      out[id].w = (ow['_'+id+'_w'] || defW) / VB_W;
      out[id].h = (ow['_'+id+'_h'] || defH) / VB_H;
    }
  }
  c.overworld.node_positions = out;
}

let layoutMode = 0;
const LAYOUT_MODES = ['horizontal', 'arc', 'zigzag', 'diagonal', 'compact', 'staircase'];

function autoLayoutPositions(c, mode) {
  const levels = c.overworld.levels || [];
  const key = c.id;
  dagPositions[key] = {};
  const pos = dagPositions[key];
  const bossLvl = c.overworld.boss_level != null ? c.overworld.boss_level : Math.min(levels.length - 1, 4);
  const pad = 80;
  const usableW = VB_W - pad * 2;
  const usableH = VB_H - pad * 2;
  const mainLevels = [];
  const branchLevels = [];
  for (let i = 0; i < levels.length; i++) {
    if (i <= bossLvl) mainLevels.push(i); else branchLevels.push(i);
  }
  const allIds = ['start', ...mainLevels.map(i => 'level_'+i)];
  const sideIds = [...branchLevels.map(i => 'level_'+i), 'store'];
  const gapX = allIds.length > 1 ? usableW / (allIds.length - 1 + (sideIds.length > 0 ? 1 : 0)) : usableW;
  const gapY = usableH * 0.2;

  if (mode === 'horizontal') {
    const y = VB_H * 0.38;
    allIds.forEach((id, i) => { pos[id] = { x: pad + i * gapX, y }; });
    const bx = pad + (Math.min(2, bossLvl) + 1) * gapX;
    sideIds.forEach((id, i) => { pos[id] = { x: bx + i * gapX, y: y + gapY }; });
  }
  else if (mode === 'arc') {
    const cx = VB_W / 2, cy = VB_H * 0.55;
    const rx = usableW * 0.45, ry = usableH * 0.3;
    allIds.forEach((id, i) => {
      const t = i / Math.max(allIds.length - 1, 1);
      const ang = Math.PI + t * Math.PI;
      pos[id] = { x: cx + Math.cos(ang) * rx - 60, y: cy + Math.sin(ang) * ry - 25 };
    });
    sideIds.forEach((id, i) => { pos[id] = { x: cx - 60 + i * gapX, y: cy + ry * 0.7 }; });
  }
  else if (mode === 'zigzag') {
    const baseY = VB_H * 0.28;
    const zigH = usableH * 0.15;
    allIds.forEach((id, i) => { pos[id] = { x: pad + i * gapX, y: baseY + (i % 2) * zigH }; });
    const bx = pad + (Math.min(2, bossLvl) + 1) * gapX;
    sideIds.forEach((id, i) => { pos[id] = { x: bx + i * gapX, y: baseY + zigH + gapY }; });
  }
  else if (mode === 'compact') {
    const perRow = Math.ceil(allIds.length / 2);
    const rowGap = usableH * 0.25;
    allIds.forEach((id, i) => {
      const row = Math.floor(i / perRow);
      const col = row === 0 ? i : (perRow - 1 - (i - perRow));
      pos[id] = { x: pad + col * gapX, y: pad + 80 + row * rowGap };
    });
    sideIds.forEach((id, i) => { pos[id] = { x: pad + i * gapX, y: pad + 80 + 2 * rowGap + 20 }; });
  }
  else if (mode === 'staircase') {
    const stepX = usableW / Math.max(allIds.length, 1);
    const stepY = usableH * 0.1;
    allIds.forEach((id, i) => { pos[id] = { x: pad + i * stepX, y: pad + 80 + i * stepY }; });
    const mid = Math.min(2, allIds.length - 1);
    sideIds.forEach((id, i) => { pos[id] = { x: pad + mid * stepX + gapX + i * gapX, y: pad + 80 + mid * stepY }; });
  }
  else if (mode === 'diagonal') {
    const stepX = usableW / Math.max(allIds.length, 1);
    const stepY = usableH * 0.12;
    allIds.forEach((id, i) => { pos[id] = { x: pad + i * stepX, y: pad + 80 + i * stepY }; });
    const bx = pad + (Math.min(2, bossLvl) + 1) * stepX;
    const by = pad + 80 + (Math.min(2, bossLvl) + 1) * stepY;
    sideIds.forEach((id, i) => { pos[id] = { x: bx + 80 + i * stepX, y: by + 80 + i * stepY }; });
  }
  pos['title'] = { x: VB_W / 2 - 300, y: 20 };
  pos['desc'] = { x: VB_W / 2 - 400, y: 110 };
}

function autoLayout() {
  const c = getCampaign(selectedCampaignId);
  layoutMode = (layoutMode + 1) % LAYOUT_MODES.length;
  autoLayoutPositions(c, LAYOUT_MODES[layoutMode]);
  saveDagPositions(c);
  renderDAG(c);
  showToast(`Layout: ${LAYOUT_MODES[layoutMode]}`, 'info');
}

// ── Procedural terrain background (SVG) ──
function renderTerrainSVG(c, pos, levels) {
  const conns = getConnections(c);
  const seed = c.overworld._terrain_seed || 42;
  const T = 14;
  const cols = Math.ceil(VB_W/T), rows = Math.ceil(VB_H/T);
  const mkRng = (s) => { let v=s>>>0; return ()=>{v=(v*1103515245+12345)>>>0;return((v>>16)&0x7FFF)/0x7FFF;}; };
  const pHex = (hex) => { hex=(hex||'#222').replace('#',''); if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]; };
  const bgCol = pHex(c.overworld.bg_color || '#0a0a0a');

  // Grid: 0=wall, 1=corridor, 2=room
  const grid = Array.from({length:rows},()=>Array(cols).fill(0));
  const nodeIds=['start',...levels.map((_,i)=>'level_'+i),'store'];
  const nodeCenters={};

  const nodeCenter = (id) => {
    const p=pos[id]; if(!p) return null;
    if(id==='title'||id==='desc') return null;
    const[nw,nh]=id==='start'?[200,88]:id==='store'?[240,88]:[240,100];
    return {gx:Math.floor((p.x+nw/2)/T), gy:Math.floor((p.y+nh/2)/T)};
  };

  // Palette: room floors are half-brightness of level palette
  const nodePal = (id) => {
    if(id==='start') return [[35,80,35],[45,100,45]];
    if(id==='store') return [[80,65,35],[100,85,50]];
    const idx=id.startsWith('level_')?parseInt(id.split('_')[1]):-1;
    if(idx>=0&&levels[idx]&&levels[idx].palette&&levels[idx].palette.length)
      return levels[idx].palette.map(c=>{const[r,g,b]=pHex(c);return[Math.floor(r*.45),Math.floor(g*.45),Math.floor(b*.45)];});
    return [[35,35,60],[50,50,80]];
  };

  // 1. Rooms — organic blobs around nodes
  for (const id of nodeIds) {
    const nc=nodeCenter(id); if(!nc) continue;
    nodeCenters[id]=nc;
    const radius=id==='start'||id==='store'?7:9;
    const lr=mkRng(seed+nc.gx*7919+nc.gy*104729);
    for(let dy=-radius;dy<=radius;dy++) for(let dx=-radius;dx<=radius;dx++){
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>radius) continue;
      const prob=1.0-Math.pow(dist/radius,1.5)*0.8;
      if(lr()>prob) continue;
      const gx=nc.gx+dx,gy=nc.gy+dy;
      if(gx>=0&&gx<cols&&gy>=0&&gy<rows) grid[gy][gx]=2;
    }
  }

  // 2. Corridors — narrow (3 tiles wide), L-shaped
  for (const [fId,tId] of conns) {
    const fc=nodeCenters[fId],tc=nodeCenters[tId];
    if(!fc||!tc) continue;
    // Horizontal then vertical
    const x0=Math.min(fc.gx,tc.gx),x1=Math.max(fc.gx,tc.gx);
    for(let x=x0;x<=x1;x++) for(let w=-1;w<=1;w++){
      const gy=fc.gy+w; if(gy>=0&&gy<rows&&x>=0&&x<cols&&grid[gy][x]===0) grid[gy][x]=1;
    }
    const y0=Math.min(fc.gy,tc.gy),y1=Math.max(fc.gy,tc.gy);
    for(let y=y0;y<=y1;y++) for(let w=-1;w<=1;w++){
      const gx=tc.gx+w; if(y>=0&&y<rows&&gx>=0&&gx<cols&&grid[y][gx]===0) grid[y][gx]=1;
    }
  }

  // 3. Nearest-node for palette blending
  const nearest=Array.from({length:rows},()=>Array(cols).fill(-1));
  const nearDist=Array.from({length:rows},()=>Array(cols).fill(Infinity));
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    for(let ni=0;ni<nodeIds.length;ni++){
      const nc=nodeCenters[nodeIds[ni]]; if(!nc) continue;
      const d=Math.sqrt((x-nc.gx)**2+(y-nc.gy)**2);
      if(d<nearDist[y][x]){nearDist[y][x]=d;nearest[y][x]=ni;}
    }
  }

  // 4. Second-nearest for blending
  const nearest2=Array.from({length:rows},()=>Array(cols).fill(-1));
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    for(let ni=0;ni<nodeIds.length;ni++){
      if(ni===nearest[y][x]) continue;
      const nc=nodeCenters[nodeIds[ni]]; if(!nc) continue;
      const d=Math.sqrt((x-nc.gx)**2+(y-nc.gy)**2);
      if(nearest2[y][x]===-1||d<Math.sqrt((x-(nodeCenters[nodeIds[nearest2[y][x]]]||{gx:9999,gy:9999}).gx)**2+(y-(nodeCenters[nodeIds[nearest2[y][x]]]||{gx:9999,gy:9999}).gy)**2))
        nearest2[y][x]=ni;
    }
  }

  // 5. Render
  let s='';
  const palCache={}; for(const id of nodeIds) palCache[id]=nodePal(id);

  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const ni=nearest[y][x];
    const ni2=nearest2[y][x];
    const id=(ni>=0&&nodeIds[ni])?nodeIds[ni]:'start';
    const id2=(ni2>=0&&nodeIds[ni2])?nodeIds[ni2]:id;
    const pal1=palCache[id]||[[30,30,50]];
    const pal2=palCache[id2]||pal1;
    const tr=mkRng(seed*31+y*cols+x);
    const px=x*T,py=y*T;
    const cellType=grid[y][x];

    // Blend factor between nearest palettes
    const d1=nearDist[y][x];
    const nc2=(ni2>=0&&nodeIds[ni2])?nodeCenters[nodeIds[ni2]]:null;
    const d2=nc2?Math.sqrt((x-nc2.gx)**2+(y-nc2.gy)**2):Infinity;
    const blend=d1+d2>0?d1/(d1+d2):0; // 0=nearest, 1=second nearest
    const raw1=pal1[Math.floor(tr()*pal1.length)]||[30,30,50];
    const raw2=(pal2[Math.floor(tr()*pal2.length)])||raw1;
    const raw=[
      Math.floor(raw1[0]*(1-blend)+(raw2[0]||0)*blend),
      Math.floor(raw1[1]*(1-blend)+(raw2[1]||0)*blend),
      Math.floor(raw1[2]*(1-blend)+(raw2[2]||0)*blend)
    ];

    if(cellType===0){
      // Wall — dark, uniform, subtle variation only
      const wb=0.12+tr()*0.08;
      const r=Math.floor(raw[0]*wb+bgCol[0]*(1-wb));
      const g=Math.floor(raw[1]*wb+bgCol[1]*(1-wb));
      const b=Math.floor(raw[2]*wb+bgCol[2]*(1-wb));
      s+='<rect x="'+px+'" y="'+py+'" width="'+T+'" height="'+T+'" fill="rgb('+r+','+g+','+b+')"/>';
    } else {
      // Floor — brighter with patterns
      const bright=cellType===2?0.7+tr()*0.3:0.5+tr()*0.3;
      const r=Math.floor(raw[0]*bright),g=Math.floor(raw[1]*bright),b=Math.floor(raw[2]*bright);
      const pattern=Math.floor(tr()*5);

      if(pattern<=1){
        // Stone slab
        s+='<rect x="'+px+'" y="'+py+'" width="'+T+'" height="'+T+'" fill="rgb('+r+','+g+','+b+')"/>';
      } else if(pattern===2){
        // Brick — horizontal mortar line
        const h1=Math.floor(T*0.45);
        s+='<rect x="'+px+'" y="'+py+'" width="'+T+'" height="'+h1+'" fill="rgb('+r+','+g+','+b+')"/>';
        s+='<rect x="'+px+'" y="'+(py+h1+1)+'" width="'+T+'" height="'+(T-h1-1)+'" fill="rgb('+Math.floor(r*.85)+','+Math.floor(g*.85)+','+Math.floor(b*.85)+')"/>';
      } else if(pattern===3){
        // Cobble — rounded inset
        s+='<rect x="'+(px+1)+'" y="'+(py+1)+'" width="'+(T-2)+'" height="'+(T-2)+'" rx="3" fill="rgb('+r+','+g+','+b+')"/>';
      } else {
        // Cracked — base + dark crack line
        s+='<rect x="'+px+'" y="'+py+'" width="'+T+'" height="'+T+'" fill="rgb('+r+','+g+','+b+')"/>';
        const cx=px+Math.floor(tr()*T*0.6)+1,cy=py+Math.floor(tr()*T*0.6)+1;
        s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.floor(tr()*6)+2)+'" y2="'+(cy+Math.floor(tr()*6)+2)+'" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>';
      }

      // Wall shadow — south and east edges adjacent to wall get a shadow
      const wallS=(y+1>=rows||grid[y+1][x]===0);
      const wallE=(x+1>=cols||grid[y][x+1]===0);
      const wallN=(y-1<0||grid[y-1][x]===0);
      const wallW=(x-1<0||grid[y][x-1]===0);
      if(wallN) s+='<rect x="'+px+'" y="'+py+'" width="'+T+'" height="3" fill="rgba(0,0,0,0.4)"/>';
      if(wallW) s+='<rect x="'+px+'" y="'+py+'" width="3" height="'+T+'" fill="rgba(0,0,0,0.35)"/>';
      if(wallS) s+='<rect x="'+px+'" y="'+(py+T-2)+'" width="'+T+'" height="2" fill="rgba(255,255,255,0.06)"/>';
      if(wallE) s+='<rect x="'+(px+T-2)+'" y="'+py+'" width="2" height="'+T+'" fill="rgba(255,255,255,0.05)"/>';
    }
  }
  return s;
}
function renderDAG(c) {
  // Delegate to new overworld canvas renderer
  if (document.getElementById('ow-canvas')) {
    renderOverworldCanvas(c);
    return;
  }
  const container = document.getElementById('dag-container');
  if (!container) return;
  initDagPositions(c);
  const levels = c.overworld.levels || [];
  const pos = dagPositions[c.id] || {};
  // Fixed viewBox — positions are in VB_W x VB_H space, SVG scales to container
  let svg = `<svg width="100%" height="100%" viewBox="0 0 ${VB_W} ${VB_H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="dag-svg">`;
  svg += `<defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 16 6, 0 12" fill="rgba(255,255,255,.7)"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#e94560" flood-opacity="0.5"/></filter>
    <filter id="glow-accent" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#e94560" flood-opacity="0.6"/></filter>
  </defs>`;

  // Background inside SVG so it scales with viewBox
  const _ow = c.overworld;
  const _bg = _ow.bg_color || '#0d0d1e';
  const _bgMode = _ow._bg_mode || (_ow.bg_image ? 'image' : (_ow.bg_gradient ? 'gradient' : 'solid'));
  if (_bgMode === 'image' && _ow.bg_image) {
    svg += `<image href="data:image/png;base64,${_ow.bg_image}" x="0" y="0" width="${VB_W}" height="${VB_H}" preserveAspectRatio="xMidYMid slice"/>`;
  } else if (_bgMode === 'terrain') {
    svg += `<rect x="0" y="0" width="${VB_W}" height="${VB_H}" fill="${_bg}"/>`;
    svg += renderTerrainSVG(c, pos, levels);
  } else if (_ow.bg_gradient) {
    svg += `<rect x="0" y="0" width="${VB_W}" height="${VB_H}" fill="${_bg}"/>`;
  } else {
    svg += `<rect x="0" y="0" width="${VB_W}" height="${VB_H}" fill="${_bg}"/>`;
  }

  // Node sizes (scaled for 1600x900 viewBox)
  const nodeSize = (id) => {
    if (id === 'start') return [200, 88];
    if (id === 'store') return [240, 88];
    return [240, 100];
  };
  const nodeHandlesFor = (id, n) => {
    const [nw, nh] = nodeSize(id);
    return [
      { x: n.x + nw/2, y: n.y },
      { x: n.x + nw, y: n.y + nh/2 },
      { x: n.x + nw/2, y: n.y + nh },
      { x: n.x, y: n.y + nh/2 },
    ];
  };
  // Each handle knows its direction: which way the control point should extend
  const outputHandles = (id, n) => {
    const [nw, nh] = nodeSize(id);
    return [
      { x: n.x + nw, y: n.y + nh/2, dx: 1, dy: 0 },   // right
      { x: n.x + nw/2, y: n.y + nh, dx: 0, dy: 1 },    // bottom
    ];
  };
  const inputHandles = (id, n) => {
    const [nw, nh] = nodeSize(id);
    return [
      { x: n.x, y: n.y + nh/2, dx: -1, dy: 0 },        // left
      { x: n.x + nw/2, y: n.y, dx: 0, dy: -1 },         // top
    ];
  };
  const closestHandles = (fromId, toId, from, to) => {
    const outs = outputHandles(fromId, from);
    const ins = inputHandles(toId, to);
    let best = null, bestDist = Infinity;
    for (const f of outs) {
      for (const t of ins) {
        const d = (f.x - t.x) ** 2 + (f.y - t.y) ** 2;
        if (d < bestDist) { bestDist = d; best = { fx: f.x, fy: f.y, fdx: f.dx, fdy: f.dy, tx: t.x, ty: t.y, tdx: t.dx, tdy: t.dy }; }
      }
    }
    return best;
  };
  const bezierCP = (h) => {
    // Control points extend in the handle's facing direction, guaranteeing the curve routes away from the node
    const dist = Math.sqrt((h.tx - h.fx) ** 2 + (h.ty - h.fy) ** 2);
    const off = Math.max(50, dist * 0.4);
    return {
      cx1: h.fx + h.fdx * off,
      cy1: h.fy + h.fdy * off,
      cx2: h.tx + h.tdx * off,
      cy2: h.ty + h.tdy * off,
    };
  };
  const drawLine = (fromId, toId) => {
    const from = pos[fromId], to = pos[toId];
    if (!from || !to) return '';
    const h = closestHandles(fromId, toId, from, to);
    if (!h) return '';
    const cp = bezierCP(h);
    return `<path class="conn-visible" d="M${h.fx},${h.fy} C${cp.cx1},${cp.cy1} ${cp.cx2},${cp.cy2} ${h.tx},${h.ty}" fill="none" stroke="#555" stroke-width="3" marker-end="url(#arrowhead)"/>`;
  };
  const drawConnection = (fromId, toId) => {
    const from = pos[fromId], to = pos[toId];
    if (!from || !to) return '';
    const h = closestHandles(fromId, toId, from, to);
    if (!h) return '';
    const cp = bezierCP(h);
    const d = `M${h.fx},${h.fy} C${cp.cx1},${cp.cy1} ${cp.cx2},${cp.cy2} ${h.tx},${h.ty}`;
    return `<g class="conn-group" style="cursor:pointer" onclick="deleteConnection('${fromId}','${toId}')">
      <path d="${d}" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="8" stroke-linecap="round"/>
      <path class="conn-visible" d="${d}" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3" marker-end="url(#arrowhead)"/>
      <path d="${d}" fill="none" stroke="transparent" stroke-width="28"/>
    </g>`;
  };

  // Use stored connections, or generate defaults
  const conns = getConnections(c);
  for (const [from, to] of conns) {
    svg += drawConnection(from, to);
  }

  // Connection handles: 4 per node (top, right, bottom, left)
  const handles = (nodeId, px, py, nw, nh) => {
    nw = nw || 240; nh = nh || 100;
    const pts = [
      [px + nw/2, py, nodeId],       // top center
      [px + nw, py + nh/2, nodeId],  // right center
      [px + nw/2, py + nh, nodeId],  // bottom center
      [px, py + nh/2, nodeId],       // left center
    ];
    return pts.map(([cx, cy, id]) =>
      `<circle cx="${cx}" cy="${cy}" r="8" fill="rgba(255,255,255,.15)" stroke="rgba(255,255,255,.4)" stroke-width="2" class="conn-handle" style="cursor:crosshair" onmousedown="event.stopPropagation();startConnDrag(event,'${id}')"/>`
    ).join('');
  };

  // Start node (200x88)
  const sp = pos['start'] || { x: 80, y: 360 };
  svg += `<g class="dag-node" data-id="start" onmousedown="dagMouseDown(event,'start')" filter="url(#shadow)">
    <rect x="${sp.x}" y="${sp.y}" width="200" height="88" rx="44" fill="#2e7d32" stroke="rgba(76,175,80,.4)" stroke-width="3"/>
    <text x="${sp.x+100}" y="${sp.y+52}" text-anchor="middle" fill="#fff" font-size="24" font-weight="700" letter-spacing="2">START</text>
    ${handles('start', sp.x, sp.y, 200, 88)}</g>`;

  // Level nodes (240x100)
  for (let i = 0; i < levels.length; i++) {
    const lv = levels[i];
    const p = pos['level_' + i] || { x: 350 + i * 280, y: 360 };
    const fill = lv.palette && lv.palette[0] ? lv.palette[0] : (lv.color || '#0f3460');
    const bossIdx = c.overworld.boss_level != null ? c.overworld.boss_level : Math.min(levels.length - 1, 4);
    const isFinalBoss = i === bossIdx;
    const isSelected = dagSelectedNode === i;
    const strokeCol = isFinalBoss ? '#e94560' : 'rgba(255,255,255,.12)';
    const strokeW = isFinalBoss ? 4 : (isSelected ? 4 : 2);
    const selStroke = isSelected ? '#e94560' : strokeCol;
    const nodeFilter = isSelected ? 'filter="url(#glow-accent)"' : (isFinalBoss ? 'filter="url(#glow-red)"' : 'filter="url(#shadow)"');
    svg += `<g class="dag-node ${isSelected ? 'selected' : ''}" data-id="level_${i}"
      onmousedown="dagMouseDown(event,'level_${i}')" ${nodeFilter}>
      <rect x="${p.x}" y="${p.y}" width="240" height="100" rx="20" fill="${h(fill)}" stroke="${selStroke}" stroke-width="${strokeW}"/>
      <rect x="${p.x}" y="${p.y}" width="240" height="48" rx="20" fill="rgba(255,255,255,.06)"/>
      <text x="${p.x+120}" y="${p.y+36}" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">${h(lv.name||'Level '+(i+1))}</text>
      <rect x="${p.x+16}" y="${p.y+56}" width="68" height="32" rx="16" fill="rgba(255,255,255,.1)"/>
      <text x="${p.x+50}" y="${p.y+78}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="16" font-weight="600">Lvl ${i+1}</text>
      <rect x="${p.x+156}" y="${p.y+56}" width="68" height="32" rx="16" fill="rgba(255,255,255,.1)"/>
      <text x="${p.x+190}" y="${p.y+78}" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="16" font-weight="600">${lv.budget||0}$</text>
      ${handles('level_'+i, p.x, p.y, 240, 100)}</g>`;
  }

  // Store node (240x88)
  const stp = pos['store'] || { x: 1200, y: 600 };
  svg += `<g class="dag-node" data-id="store" onmousedown="dagMouseDown(event,'store')" filter="url(#shadow)">
    <rect x="${stp.x}" y="${stp.y}" width="240" height="88" rx="44" fill="#5d4e37" stroke="rgba(255,215,0,.3)" stroke-width="3"/>
    <text x="${stp.x+120}" y="${stp.y+52}" text-anchor="middle" fill="#ffd700" font-size="24" font-weight="700" letter-spacing="2">STORE</text>
    ${handles('store', stp.x, stp.y, 240, 88)}</g>`;

  // Title + Description as two separate draggable/resizable text boxes
  const ow = c.overworld;
  const tc = ow.text_color || '#e8e8e8';
  const tfs = ow._title_font_size || 36;
  const dfs = ow._desc_font_size || 14;
  const tFontCSS = ow.font ? `font-family:'${ow.font}',system-ui;` : '';
  const dFontCSS = ow.description_font ? `font-family:'${ow.description_font}',system-ui;` : '';

  // Helper: wrap text into lines that fit a given width (approximate using char count)
  const svgWordWrap = (text, fontSize, maxW) => {
    const charsPerLine = Math.max(1, Math.floor(maxW / (fontSize * 0.55)));
    const words = (text || '').split(/\s+/);
    const lines = []; let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (test.length > charsPerLine && cur) { lines.push(cur); cur = w; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  };

  // Helper to render a text box node using SVG text (no foreignObject)
  const textBox = (id, text, fontSize, fontFamily, fontWeight, opacity, defaultPos, defaultW, defaultH) => {
    const p = pos[id] || defaultPos;
    const bw = ow['_'+id+'_w'] || defaultW;
    const bh = ow['_'+id+'_h'] || defaultH;
    const sel = dagSelectedNode === id;
    const st = sel ? 'rgba(233,69,96,.6)' : 'rgba(255,255,255,.12)';
    const lines = svgWordWrap(text, fontSize, bw - 16);
    const lineH = fontSize * 1.25;
    const totalH = lines.length * lineH;
    const startY = p.y + (bh - totalH) / 2 + fontSize;
    let tspans = '';
    for (let i = 0; i < lines.length; i++) {
      tspans += `<tspan x="${p.x + bw/2}" dy="${i === 0 ? 0 : lineH}">${h(lines[i])}</tspan>`;
    }
    let s = `<g class="dag-node" data-id="${id}" onmousedown="dagMouseDown(event,'${id}')">
      <rect x="${p.x}" y="${p.y}" width="${bw}" height="${bh}" rx="6" fill="rgba(0,0,0,0.01)" stroke="${st}" stroke-width="2" stroke-dasharray="8,6"/>
      <text x="${p.x + bw/2}" y="${startY}" text-anchor="middle" fill="${tc}" font-size="${fontSize}" font-weight="${fontWeight}" opacity="${opacity}" style="${fontFamily}">${tspans}</text>
      <rect x="${p.x+bw-18}" y="${p.y+bh-18}" width="18" height="18" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.25)" stroke-width="1.5" rx="3" style="cursor:nwse-resize" onmousedown="event.stopPropagation();startBoxResize(event,'${id}')"/>
      <line x1="${p.x+bw-14}" y1="${p.y+bh-7}" x2="${p.x+bw-7}" y2="${p.y+bh-14}" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
    </g>`;
    return s;
  };

  svg += textBox('title', ow.name, tfs, tFontCSS, 700, 1, {x:VB_W/2-300, y:20}, 600, 80);
  svg += textBox('desc', ow.description, dfs, dFontCSS, 400, 0.7, {x:VB_W/2-400, y:110}, 800, 60);

  // Popups for text boxes when selected
  let popup = '';
  const scrubPopup = (id, label, fsKey, fsVal, p, bh) => {
    return `<foreignObject x="${p.x}" y="${p.y+bh+4}" width="200" height="44">
      <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;gap:6px;align-items:center;background:rgba(20,20,40,.92);border:1px solid rgba(233,69,96,.4);border-radius:8px;padding:5px 10px;">
        <span style="font-size:13px;color:#888;cursor:ew-resize;user-select:none;" onmousedown="startScrub(event,'${fsKey}',${fsVal})">${label}</span>
        <input type="number" value="${fsVal}" min="6" max="200" style="width:50px;font-size:13px;padding:2px 4px;background:#1a1a2e;color:#eee;border:1px solid #444;border-radius:4px;"
          onchange="getCampaign(selectedCampaignId).overworld.${fsKey}=+this.value;saveDagPositions(getCampaign(selectedCampaignId));renderDAG(getCampaign(selectedCampaignId))">
        <span style="font-size:12px;color:#555;">px</span>
      </div>
    </foreignObject>`;
  };
  if (dagSelectedNode === 'title') {
    const p = pos['title'] || {x:VB_W/2-300,y:20};
    popup = scrubPopup('title', 'Size', '_title_font_size', tfs, p, ow._title_h||80);
  } else if (dagSelectedNode === 'desc') {
    const p = pos['desc'] || {x:VB_W/2-400,y:110};
    popup = scrubPopup('desc', 'Size', '_desc_font_size', dfs, p, ow._desc_h||60);
  } else if (dagSelectedNode !== null && typeof dagSelectedNode === 'number' && dagSelectedNode < levels.length) {
    const lv = levels[dagSelectedNode];
    const nodePos = pos['level_' + dagSelectedNode];
    if (nodePos) {
      const isBoss = (c.overworld.boss_level != null ? c.overworld.boss_level : Math.min(levels.length-1, 4)) === dagSelectedNode;
      popup = `<foreignObject x="${nodePos.x}" y="${nodePos.y+104}" width="240" height="44">
        <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;gap:4px;align-items:center;background:rgba(20,20,40,.9);border:1px solid rgba(233,69,96,.4);border-radius:8px;padding:4px 8px;">
          <span style="font-size:14px;color:#888;">$</span>
          <input type="number" value="${lv.budget||0}" min="0" max="999" style="width:60px;font-size:14px;padding:2px 4px;background:#1a1a2e;color:#eee;border:1px solid #444;border-radius:4px;"
            onchange="updateLevel(${dagSelectedNode},'budget',+this.value);renderDAG(getCampaign(selectedCampaignId))">
          <button style="font-size:12px;padding:2px 6px;background:${isBoss?'var(--accent)':'#333'};color:#fff;border:1px solid ${isBoss?'var(--accent)':'#555'};border-radius:4px;cursor:pointer;" onclick="setBossLevel(${dagSelectedNode})">${isBoss?'&#9733;':'&#9734;'}</button>
          <button style="font-size:12px;padding:2px 6px;background:#8b0000;color:#fff;border:1px solid #a00;border-radius:4px;cursor:pointer;" onclick="deleteLevel(${dagSelectedNode})">&#10005;</button>
        </div>
      </foreignObject>`;
    }
  }

  svg += popup;
  svg += '</svg>';

  if (ow.font) loadGoogleFont(ow.font);
  if (ow.description_font) loadGoogleFont(ow.description_font);

  container.innerHTML = svg;

  // Attach drag handlers
  const svgEl = document.getElementById('dag-svg');
  svgEl.addEventListener('mousemove', dagMouseMove);
  svgEl.addEventListener('mouseup', dagMouseUp);
  svgEl.addEventListener('mouseleave', dagMouseUp);
  // Click blank canvas or background to deselect
  svgEl.addEventListener('click', (e) => {
    const tag = e.target.tagName.toLowerCase();
    const isBackground = tag === 'svg' || (tag === 'rect' && !e.target.closest('.dag-node')) || (tag === 'image' && !e.target.closest('.dag-node'));
    if (e.target === svgEl || isBackground) {
      dagSelectedNode = null;
      renderDAG(c);
    }
  });
}

// Convert mouse event to SVG viewBox coordinates (accounts for preserveAspectRatio)
function svgCoords(e) {
  const svg = document.getElementById('dag-svg');
  if (!svg) return { x: e.clientX, y: e.clientY };
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return { x: e.clientX, y: e.clientY };
  const svgPt = pt.matrixTransform(ctm.inverse());
  return { x: svgPt.x, y: svgPt.y };
}

function dagMouseDown(e, nodeId) {
  e.preventDefault();
  const c = getCampaign(selectedCampaignId);
  const pos = dagPositions[c.id] || {};
  const p = pos[nodeId];
  if (!p) return;

  if (addConnectionMode) {
    if (!connectionSource) {
      connectionSource = nodeId;
      document.getElementById('dag-status').textContent = 'Click target node...';
    } else {
      addConnectionMode = false;
      connectionSource = null;
      document.getElementById('conn-btn').style.background = '';
      document.getElementById('dag-status').textContent = '';
    }
    return;
  }

  // Double-click detection: if same node clicked twice within 400ms, open level editor
  if (nodeId.startsWith('level_')) {
    if (dagClickNodeId === nodeId && dagClickTimer) {
      // Double click detected
      clearTimeout(dagClickTimer);
      dagClickTimer = null;
      dagClickNodeId = null;
      const idx = parseInt(nodeId.split('_')[1]);
      selectLevel(idx);
      return;
    }
    // First click — highlight and wait for possible second click
    dagClickNodeId = nodeId;
    if (dagClickTimer) clearTimeout(dagClickTimer);
    dagClickTimer = setTimeout(() => {
      dagClickTimer = null;
      dagClickNodeId = null;
    }, 400);
    const idx = parseInt(nodeId.split('_')[1]);
    dagSelectedNode = idx;
  } else if (nodeId === 'title' || nodeId === 'desc') {
    dagSelectedNode = nodeId;
  }

  // Re-render DAG to show popup on selected node
  if (!dagDragMoved) renderDAG(c);

  // Start drag tracking (won't actually move unless mouse moves)
  dagDragging = nodeId;
  const mc = svgCoords(e);
  dagDragOffset = { x: mc.x - p.x, y: mc.y - p.y };
  dagDragMoved = false;
}

let dagConnecting = false;
let connDragSource = null;
let connDragStart = null; // {x,y} of the handle we started from

function startConnDrag(e, nodeId) {
  e.stopPropagation();
  e.preventDefault();
  connDragSource = nodeId;
  // Capture the handle position from the clicked circle
  const circle = e.target;
  connDragStart = { x: parseFloat(circle.getAttribute('cx')), y: parseFloat(circle.getAttribute('cy')) };
  const svg = document.getElementById('dag-svg');
  if (svg) {
    svg.addEventListener('mousemove', connDragMove);
    svg.addEventListener('mouseup', connDragEnd);
    svg.addEventListener('mouseleave', connDragEnd);
  }
}

function connDragMove(e) {
  if (!connDragSource) return;
  const svg = document.getElementById('dag-svg');
  if (!svg) return;
  // Remove old temp line
  const old = document.getElementById('conn-temp-line');
  if (old) old.remove();
  const c = getCampaign(selectedCampaignId);
  const pos = dagPositions[c.id] || {};
  const fromPos = pos[connDragSource];
  if (!fromPos) return;
  const mc = svgCoords(e);
  const mx = mc.x, my = mc.y;
  const fx = connDragStart ? connDragStart.x : fromPos.x + 60;
  const fy = connDragStart ? connDragStart.y : fromPos.y + 25;
  const dx = Math.abs(mx - fx), dy = Math.abs(my - fy);
  const off = Math.max(dx, dy) * 0.5;
  const cx1 = dx >= dy ? fx + (mx > fx ? off : -off) : fx;
  const cy1 = dx >= dy ? fy : fy + (my > fy ? off : -off);
  const cx2 = dx >= dy ? mx - (mx > fx ? off : -off) : mx;
  const cy2 = dx >= dy ? my : my - (my > fy ? off : -off);
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('id', 'conn-temp-line');
  path.setAttribute('d', `M${fx},${fy} C${cx1},${cy1} ${cx2},${cy2} ${mx},${my}`);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#e94560');
  path.setAttribute('stroke-width', '2');
  path.setAttribute('stroke-dasharray', '6,4');
  svg.appendChild(path);
}

function connDragEnd(e) {
  const old = document.getElementById('conn-temp-line');
  if (old) old.remove();
  if (connDragSource && e) {
    const svg = document.getElementById('dag-svg');
    const c = getCampaign(selectedCampaignId);
    const pos = dagPositions[c.id] || {};
    if (svg) {
      const mc = svgCoords(e);
      const mx = mc.x, my = mc.y;
      // Check if dropped on an existing node (with generous 20px padding)
      let hitNode = null;
      let bestDist = Infinity;
      for (const nodeId in pos) {
        if (nodeId === connDragSource) continue;
        const p = pos[nodeId];
        const cx = p.x + 120, cy = p.y + 50;
        const dist = Math.sqrt((mx - cx) ** 2 + (my - cy) ** 2);
        if (dist < 80 && dist < bestDist) {
          bestDist = dist;
          hitNode = nodeId;
        }
      }
      if (hitNode) {
        addConnection(connDragSource, hitNode);
      } else if (mx > 0 && my > 0) {
        // Dropped on blank canvas — create a new level here
        const newIdx = c.overworld.levels.length;
        c.overworld.levels.push({
          name: 'New Level', font: null, description: '', theme: '',
          color: null, palette: ['#444444', '#666666', '#888888'], budget: 150
        });
        // Ensure matching design
        while (c.designs.length < c.overworld.levels.length) {
          c.designs.push({
            tile_defs: [{ name: 'wall', char: '#' }, { name: 'floor', char: '.' }],
            boss: { name: '', hp: 0, attack: 0, defense: 0, xp_value: 0, description: '' },
            monster_types: [], weapon: { name: '', description: '' },
            armor: { name: '', description: '' }, traps: [],
            mode: { root: 'C', scale: 'aeolian' },
            victory_message: '', defeat_message: '', budget_spent: null
          });
        }
        const newId = 'level_' + newIdx;
        pos[newId] = { x: mx - 120, y: my - 50 };
        // Connect from source to new node
        if (!c.overworld.connections) getConnections(c);
        c.overworld.connections.push([connDragSource, newId]);
        renderDAG(c);
      }
      svg.removeEventListener('mousemove', connDragMove);
      svg.removeEventListener('mouseup', connDragEnd);
      svg.removeEventListener('mouseleave', connDragEnd);
    }
  }
  connDragSource = null;
}

function dagMouseMove(e) {
  if (!dagDragging) return;
  dagDragMoved = true;
  const c = getCampaign(selectedCampaignId);
  const mc = svgCoords(e);
  const x = mc.x - dagDragOffset.x;
  const y = mc.y - dagDragOffset.y;
  dagPositions[c.id][dagDragging] = { x: Math.max(0, x), y: Math.max(0, y) };
  saveDagPositions(c);
  renderDAG(c);
}

function dagMouseUp(e) {
  dagDragging = null;
  dagDragMoved = false;
  if (titleResizing) {
    titleResizing = false;
    const c = getCampaign(selectedCampaignId);
    saveDagPositions(c);
    renderDAG(c);
  }
}

// Generic text box resize
function startBoxResize(e, boxId) {
  e.stopPropagation();
  e.preventDefault();
  const mc = svgCoords(e);
  const c = getCampaign(selectedCampaignId);
  const defW = boxId === 'title' ? 600 : 800;
  const defH = boxId === 'title' ? 80 : 60;
  const startW = c.overworld['_'+boxId+'_w'] || defW;
  const startH = c.overworld['_'+boxId+'_h'] || defH;
  const startMx = mc.x, startMy = mc.y;
  const move = (ev) => {
    const m = svgCoords(ev);
    c.overworld['_'+boxId+'_w'] = Math.max(100, startW + m.x - startMx);
    c.overworld['_'+boxId+'_h'] = Math.max(30, startH + m.y - startMy);
    renderDAG(c);
  };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    saveDagPositions(c);
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

// Scrub label: drag left/right to change a numeric value
function startScrub(e, key, startVal) {
  e.preventDefault();
  const startX = e.clientX;
  const c = getCampaign(selectedCampaignId);
  document.body.style.cursor = 'ew-resize';
  const move = (ev) => {
    const dx = ev.clientX - startX;
    const newVal = Math.round(Math.max(6, Math.min(200, startVal + dx * 0.3)));
    c.overworld[key] = newVal;
    renderDAG(c);
  };
  const up = () => {
    document.body.style.cursor = '';
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    saveDagPositions(c);
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function selectLevel(idx) {
  selectedLevelIdx = idx;
  currentTab = 'level';
  render();
  showCurrentMap();
}

let currentTab = 'level';
let placementTool = 'none';

// Budget costs per entity type (matching engine costs in gen.rs)
const ENTITY_COSTS = {
  monster: 6,   // avg of 5-8
  trap: 5,      // avg of 3-8
  gold: 3,      // avg of 2-5
  potion: 0,    // free
  weapon: 0,    // free
  armor: 0,     // free
  key: 0,       // free
  speed_potion: 0,
  bomb: 0,
};

function calcBudgetSpent(pe, levelIdx) {
  let spent = 0;
  // Boss: ~20% of budget
  const c = getCampaign(selectedCampaignId);
  const lv = c?.overworld?.levels?.[levelIdx];
  const budget = lv?.budget || 0;
  spent += Math.round(budget * 0.20); // boss always costs ~20%
  spent += (pe.monsters?.length || 0) * ENTITY_COSTS.monster;
  spent += (pe.traps?.length || 0) * ENTITY_COSTS.trap;
  for (const it of (pe.items || [])) {
    spent += ENTITY_COSTS[it.item_type] || 3;
  }
  return spent;
}

      <span style="color:#4dd0e1">&#9632;</span> Key
      <span style="color:#ff69b4">&#9632;</span> Monster
      <span style="color:#ffa726">&#9632;</span> Item
      <span style="color:#ab47bc">&#9632;</span> Trap
      <span style="color:#ffcc00">&#9632;</span> Exit
    </span>
  </div>`;
  html += `</div>`;

  // ── Right: tabbed sidebar (35%) ──
  html += `<div class="level-sidebar">`;
  html += `<div class="tab-bar">`;
  const tabs = [
    { id: 'level', label: 'Level' },

    { id: 'creatures', label: 'Creatures' },
    { id: 'items', label: 'Items' },
    { id: 'music', label: 'Music' },

  const desc = m.description || '';
  const prompt = `2D pixel art sprite of a roguelike game monster called "${m.name}". ${desc}. ` +
    `Top-down view, 32x32 pixel art, single creature centered on a pure solid BLACK background (#000000). ` +
    `Simple, readable silhouette. Bright colorful creature on BLACK. No text, no UI, no ground, no shadows.`;
  showToast('Generating sprite...', 'info');

function removeBlackBackground(b64) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, c.width, c.height);
      const px = data.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i+1], b = px[i+2];
        const brightness = (r + g + b) / 3;
        if (brightness < 30) {
          // Near-black → fully transparent
          px[i+3] = 0;
        } else if (brightness < 60) {
          // Dark → fade to transparent (smooth edge)
          px[i+3] = Math.round((brightness - 30) / 30 * 255);
        }
        // else: keep as-is
      }
      ctx.putImageData(data, 0, 0);
      resolve(c.toDataURL('image/png').split(',')[1]);
    };
    img.onerror = () => resolve(b64);
    img.src = 'data:image/png;base64,' + b64;
  });
}

function cropToContent(b64) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, c.width, c.height);
      const px = data.data;
      let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
      for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
          const a = px[(y * c.width + x) * 4 + 3];
          if (a > 10) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX <= minX || maxY <= minY) { resolve(b64); return; }
      // Add 1px padding
      minX = Math.max(0, minX - 1);
      minY = Math.max(0, minY - 1);
      maxX = Math.min(c.width - 1, maxX + 1);
      maxY = Math.min(c.height - 1, maxY + 1);
      const cw = maxX - minX + 1, ch = maxY - minY + 1;
      // Make it square (use the larger dimension)
      const size = Math.max(cw, ch);
      const out = document.createElement('canvas');
      out.width = size;
      out.height = size;
      const octx = out.getContext('2d');
      octx.drawImage(c, minX, minY, cw, ch, (size - cw) / 2, (size - ch) / 2, cw, ch);
      resolve(out.toDataURL('image/png').split(',')[1]);
    };
    img.onerror = () => resolve(b64);
    img.src = 'data:image/png;base64,' + b64;
  });
}

function syncPaletteFromTiles(idx) {
  const c = getCampaign(selectedCampaignId);
  const lv = c.overworld.levels[idx];
  const design = c.designs[idx] || {};
  const defs = design.tile_defs || [];
  if (!lv.palette) lv.palette = [];
  let pending = 0;
  let done = 0;
  for (let i = 0; i < defs.length; i++) {
    if (defs[i].image) {
      pending++;
      dominantColor(defs[i].image, (color) => {
        lv.palette[i] = color;
        done++;
        if (done >= pending) {
          // Also set level color to the floor tile color (index 1)
          if (lv.palette[1]) lv.color = lv.palette[1];
          refreshLevelEditor();
          showToast('Palette synced from tiles', 'success');
        }
      });
    }
  }
  if (pending === 0) showToast('No tile images to sample from', 'info');
}

function dominantColor(b64, cb) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, c.width, c.height).data;
    let tr = 0, tg = 0, tb = 0, count = 0;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i+3] > 30) { // skip transparent
        tr += data[i]; tg += data[i+1]; tb += data[i+2]; count++;
      }
    }
    if (count === 0) { cb('#555555'); return; }
    const r = Math.round(tr/count), g = Math.round(tg/count), b = Math.round(tb/count);
    cb('#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join(''));
  };
  img.onerror = () => cb('#555555');
  img.src = 'data:image/png;base64,' + b64;
}

    `Perfectly seamless and tileable in all directions. Uniform texture with NO focal point, NO objects, NO borders, NO text. ` +

// Blend a base64 image with a solid color. strength=0 is original, strength=1 is solid color.
function blendWithColor(b64, hexColor, strength) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      // Draw original
      ctx.drawImage(img, 0, 0);
      // Overlay solid color with opacity = strength
      ctx.globalAlpha = strength;
      ctx.fillStyle = hexColor;
      ctx.fillRect(0, 0, c.width, c.height);
      // Extract as base64 (strip data URL prefix)
      const dataUrl = c.toDataURL('image/png');
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = () => resolve(b64); // fallback to original on error
    img.src = 'data:image/png;base64,' + b64;
  });
}

function mapEntityDragStart(e, levelIdx) {
  if (e.button !== 0) return; // left click only
  if (!mapPreviewData?.tiles) return;
  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);

  const pe = ensurePlacedEntities(levelIdx);
  // Check boss (2x2 hit area)
  if (pe.boss) {
    const [bx, by] = pe.boss;
    if (tx >= bx && tx < bx + 2 && ty >= by && ty < by + 2) {
      mapDragEntity = { levelIdx, type: 'boss', origX: bx, origY: by };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
  // Check entry door
  if (pe.entry_door) {
    const [ex, ey] = pe.entry_door;
    if (tx === ex && ty === ey) {
      mapDragEntity = { levelIdx, type: 'entry_door', origX: ex, origY: ey };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
  // Check exit door
  if (pe.exit_door) {
    const [ex, ey] = pe.exit_door;
    if (tx === ex && ty === ey) {
      mapDragEntity = { levelIdx, type: 'exit_door', origX: ex, origY: ey };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
  // Check monsters
  for (let i = 0; i < pe.monsters.length; i++) {
    if (pe.monsters[i].x === tx && pe.monsters[i].y === ty) {
      mapDragEntity = { levelIdx, type: 'monster', index: i, origX: tx, origY: ty };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
  // Check items
  for (let i = 0; i < pe.items.length; i++) {
    if (pe.items[i].x === tx && pe.items[i].y === ty) {
      mapDragEntity = { levelIdx, type: 'item', index: i, origX: tx, origY: ty };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
  // Check traps
  for (let i = 0; i < pe.traps.length; i++) {
    if (pe.traps[i].x === tx && pe.traps[i].y === ty) {
      mapDragEntity = { levelIdx, type: 'trap', index: i, origX: tx, origY: ty };
      canvas.style.cursor = 'grabbing';
      canvas.addEventListener('mousemove', mapEntityDragMove);
      canvas.addEventListener('mouseup', mapEntityDragEnd);
      e.preventDefault();
      return;
    }
  }
}

function mapEntityDragMove(e) {
  if (!mapDragEntity || !mapPreviewData?.tiles) return;
  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);
  if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;

  // Show highlight at target
  const c = getCampaign(selectedCampaignId);
  const lv = c.overworld.levels[selectedLevelIdx];
  const design = c.designs[selectedLevelIdx] || {};
  const pe = ensurePlacedEntities(selectedLevelIdx);
  renderMapCanvas(mapPreviewData, lv.palette || [], design.tile_defs || [], pe).then(() => {
    const ctx = canvas.getContext('2d');
    const size = mapDragEntity.type === 'boss' ? 2 : 1;
    ctx.fillStyle = 'rgba(102, 187, 106, 0.35)';
    ctx.fillRect(tx * cellW, ty * cellH, cellW * size, cellH * size);
    ctx.strokeStyle = '#66bb6a';
    ctx.lineWidth = 2;
    ctx.strokeRect(tx * cellW + 1, ty * cellH + 1, cellW * size - 2, cellH * size - 2);
  });
}

function mapEntityDragEnd(e) {
  const canvas = document.getElementById('map-canvas');
  canvas.removeEventListener('mousemove', mapEntityDragMove);
  canvas.removeEventListener('mouseup', mapEntityDragEnd);
  canvas.style.cursor = 'default';
  if (!mapDragEntity || !mapPreviewData?.tiles) { mapDragEntity = null; return; }

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cols = mapPreviewData.tiles[0].length;
  const rows = mapPreviewData.tiles.length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);

  if (tx >= 0 && ty >= 0 && tx < cols && ty < rows && (tx !== mapDragEntity.origX || ty !== mapDragEntity.origY)) {
    const pe = ensurePlacedEntities(mapDragEntity.levelIdx);
    if (mapDragEntity.type === 'entry_door') {
      pe.entry_door = [tx, ty];
    } else if (mapDragEntity.type === 'exit_door') {
      pe.exit_door = [tx, ty];
    } else if (mapDragEntity.type === 'boss') {
      pe.boss = [tx, ty];
    } else if (mapDragEntity.type === 'monster') {
      pe.monsters[mapDragEntity.index].x = tx;
      pe.monsters[mapDragEntity.index].y = ty;
    } else if (mapDragEntity.type === 'item') {
      pe.items[mapDragEntity.index].x = tx;
      pe.items[mapDragEntity.index].y = ty;
    } else if (mapDragEntity.type === 'trap') {
      pe.traps[mapDragEntity.index].x = tx;
      pe.traps[mapDragEntity.index].y = ty;
    }
  }

  mapDragEntity = null;
  const c = getCampaign(selectedCampaignId);
  const lv = c.overworld.levels[selectedLevelIdx];
  const design = c.designs[selectedLevelIdx] || {};
  const pe = ensurePlacedEntities(selectedLevelIdx);
  renderMapCanvas(mapPreviewData, lv.palette || [], design.tile_defs || [], pe);
}

// ── Scrabble Tray ──

function packItemSprite(itemType) {
  return (pack.item_sprites && pack.item_sprites[itemType]) || null;
}
function packItemName(itemType) {
  const defaults = { potion: 'Health Potion', speed_potion: 'Speed Potion', bomb: 'Bomb', gold: 'Gold', key: 'Key' };
  return (pack.item_names && pack.item_names[itemType]) || defaults[itemType] || itemType;
}

function generateTray(c, levelIdx, placed) {
  const lv = c.overworld.levels[levelIdx];
  const design = c.designs[levelIdx] || {};
  const budget = lv.budget || 150;
  const floor = levelIdx + 1;
  const monsters = c.monster_templates || design.monster_types || [];
  const trapDefs = design.traps || [];

  // Compute what the budget buys (mirroring gen.rs logic)
  let rem = budget;
  const tray = [];

  // Boss: ~20% of budget (always 1, designer places it)
  const bossCost = Math.round(budget * 0.20);
  rem -= bossCost;
  const bossName = design.boss?.name || 'Boss';
  tray.push({ type: 'boss', name: bossName, icon: '💀', image: design.boss?.image || null, item_type: 'boss' });

  // Split remaining budget: ~60% monsters, ~25% gold, ~15% traps
  const monBudget = Math.round(rem * 0.6);
  const goldBudget = Math.round(rem * 0.25);
  const trapBudget = rem - monBudget - goldBudget;

  // Monsters: 6 cost each
  if (monsters.length > 0) {
    let mi = 0, mrem = monBudget;
    while (mrem >= 5) {
      mrem -= 6;
      const tmpl = monsters[mi % monsters.length];
      tray.push({ type: 'monster', name: tmpl.name, icon: '👾', image: tmpl.image || null, item_type: 'monster' });
      mi++;
    }
  }

  // Gold piles: 3 cost each
  let grem = goldBudget;
  let gi = 0;
  while (grem >= 3 && gi < 6) {
    grem -= 3;
    tray.push({ type: 'item', name: packItemName('gold'), icon: '💰', item_type: 'gold', image: packItemSprite('gold') });
    gi++;
  }

  // Traps: 5 cost each
  if (trapDefs.length > 0) {
    let trem = trapBudget, ti = 0;
    while (trem >= 5) {
      trem -= 5;
      const td = trapDefs[ti % trapDefs.length];
      tray.push({ type: 'trap', name: td.name || 'Trap', icon: '⚠', item_type: 'trap', image: td.image || null });
      ti++;
    }
  }

  // Free items: weapon, armor, potions, key
  tray.push({ type: 'item', name: design.weapon?.name || 'Weapon', icon: '⚔', item_type: 'weapon', image: design.weapon?.image || null });
  tray.push({ type: 'item', name: design.armor?.name || 'Armor', icon: '🛡', item_type: 'armor', image: design.armor?.image || null });
  const monCount = tray.filter(t => t.type === 'monster').length;
  const potionCount = Math.max(1, Math.floor(monCount / 6));
  for (let i = 0; i < potionCount; i++) {
    tray.push({ type: 'item', name: packItemName('potion'), icon: '🧪', item_type: 'potion', image: packItemSprite('potion') });
  }
  if (design.prebuilt_map?.key_position) {
    tray.push({ type: 'item', name: packItemName('key'), icon: '🔑', item_type: 'key', image: packItemSprite('key') });
  }

  // Exit door (always one per level)
  tray.push({ type: 'exit_door', name: 'Exit Door', icon: '🚪', item_type: 'exit_door' });

  // Entry door (all levels — connects to hallway from previous level or title room)
  tray.push({ type: 'entry_door', name: 'Entry Door', icon: '🔵', item_type: 'entry_door' });

  // Remove already-placed entities from the tray
  const placedMonsters = [...(placed.monsters || [])];
  const placedItems = [...(placed.items || [])];
  const placedTraps = [...(placed.traps || [])];

  return tray.filter(t => {
    if (t.type === 'exit_door') {
      if (placed.exit_door) return false;
    } else if (t.type === 'entry_door') {
      if (placed.entry_door) return false;
    } else if (t.type === 'boss') {
      if (placed.boss) return false;
    } else if (t.type === 'monster') {
      const idx = placedMonsters.findIndex(pm => pm.name === t.name);
      if (idx >= 0) { placedMonsters.splice(idx, 1); return false; }
    } else if (t.type === 'item') {
      const idx = placedItems.findIndex(pi => pi.item_type === t.item_type);
      if (idx >= 0) { placedItems.splice(idx, 1); return false; }
    } else if (t.type === 'trap') {
      const idx = placedTraps.findIndex(pt => pt.name === t.name);
      if (idx >= 0) { placedTraps.splice(idx, 1); return false; }
    }
    return true;
  });
}

let draggedTrayItem = null;
let dragHighlightTile = null; // {x, y} of currently highlighted tile during drag

function displaceAll(levelIdx) {
  const c = getCampaign(selectedCampaignId);
  const d = ensureDesign(levelIdx);
  d.placed_entities = { monsters: [], items: [], traps: [], boss: null, exit_door: null, entry_door: null };
}

// Find best exit door position: edge wall tile adjacent to walkable, nearest to boss
function findExitDoorPosition(mapData, wallName, pe) {
  const rows = mapData.tiles.length;
  const cols = mapData.tiles[0].length;
  const bp = pe.boss || mapData.boss_position || [Math.floor(cols/2), Math.floor(rows/2)];
  let best = null, bestDist = Infinity;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (mapData.tiles[y][x] !== wallName) continue;
      // Prefer tiles on the map edge (x=0, x=cols-1, y=0, y=rows-1)
      const onEdge = (x === 0 || x === cols - 1 || y === 0 || y === rows - 1);
      // Must be adjacent to a walkable tile
      const adj = [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].some(([ax,ay]) =>
        ax >= 0 && ay >= 0 && ax < cols && ay < rows && mapData.tiles[ay][ax] !== wallName && mapData.tiles[ay][ax] !== 'locked_door');
      if (!adj) continue;
      const d = Math.abs(x - bp[0]) + Math.abs(y - bp[1]);
      // Edge tiles get strong priority (subtract 1000 from distance)
      const score = onEdge ? d - 1000 : d;
      if (score < bestDist) { bestDist = score; best = [x, y]; }
    }
  }
  return best;
}

// Find best entry door position: edge wall tile adjacent to walkable, nearest to player start
function findEntryDoorPosition(mapData, wallName, pe) {
  const rows = mapData.tiles.length;
  const cols = mapData.tiles[0].length;
  const ps = mapData.player_start || [Math.floor(cols/2), Math.floor(rows/2)];
  let best = null, bestDist = Infinity;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (mapData.tiles[y][x] !== wallName) continue;
      const onEdge = (x === 0 || x === cols - 1 || y === 0 || y === rows - 1);
      const adj = [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].some(([ax,ay]) =>
        ax >= 0 && ay >= 0 && ax < cols && ay < rows && mapData.tiles[ay][ax] !== wallName && mapData.tiles[ay][ax] !== 'locked_door');
      if (!adj) continue;
      const d = Math.abs(x - ps[0]) + Math.abs(y - ps[1]);
      const score = onEdge ? d - 1000 : d;
      if (score < bestDist) { bestDist = score; best = [x, y]; }
    }
  }
  return best;
}

function autoplaceAll(levelIdx) {
  const c = getCampaign(selectedCampaignId);
  const pe = ensurePlacedEntities(levelIdx);
  const tray = generateTray(c, levelIdx, pe);
  if (tray.length === 0) { showToast('Nothing to place', 'info'); return; }
  if (!mapPreviewData?.tiles) return;

  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const design = c.designs[levelIdx] || {};
  const defs = design.tile_defs || [];
  const wallName = defs[0]?.name || 'wall';
  const occupied = new Set();
  for (const m of pe.monsters) occupied.add(m.x + ',' + m.y);
  for (const i of pe.items) occupied.add(i.x + ',' + i.y);
  for (const t of pe.traps) occupied.add(t.x + ',' + t.y);
  if (mapPreviewData.player_start) occupied.add(mapPreviewData.player_start[0] + ',' + mapPreviewData.player_start[1]);
  if (pe.boss) occupied.add(pe.boss[0]+','+pe.boss[1]);

  const isOpen = (x,y) => x>=0 && y>=0 && x<cols && y<rows &&
    mapPreviewData.tiles[y][x] !== wallName && mapPreviewData.tiles[y][x] !== 'locked_door' && !occupied.has(x+','+y);

  // Place boss first — needs 2x2 area, prefer the map's suggested boss room (farthest from player)
  const bossTray = tray.find(t => t.type === 'boss');
  if (bossTray) {
    // Find all valid 2x2 spots
    const spots2x2 = [];
    for (let y = 0; y < rows - 1; y++) {
      for (let x = 0; x < cols - 1; x++) {
        if (isOpen(x,y) && isOpen(x+1,y) && isOpen(x,y+1) && isOpen(x+1,y+1)) {
          spots2x2.push([x, y]);
        }
      }
    }
    if (spots2x2.length > 0) {
      // Pick the spot farthest from player start
      const [px, py] = mapPreviewData.player_start || [0, 0];
      spots2x2.sort((a, b) => {
        const da = (a[0]-px)**2 + (a[1]-py)**2;
        const db = (b[0]-px)**2 + (b[1]-py)**2;
        return db - da;
      });
      const [bx, by] = spots2x2[0];
      pe.boss = [bx, by];
      // Mark 2x2 as occupied
      for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++) occupied.add((bx+dx)+','+(by+dy));
    }
  }

  // Collect walkable tiles for everything else
  const walkable = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (isOpen(x,y)) walkable.push([x, y]);
    }
  }
  // Shuffle
  for (let i = walkable.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [walkable[i], walkable[j]] = [walkable[j], walkable[i]];
  }

  let wi = 0;
  const keyPos = design.prebuilt_map?.key_position;
  for (const t of tray) {
    if (t.type === 'boss') continue; // already placed
    if (t.type === 'exit_door') {
      pe.exit_door = findExitDoorPosition(mapPreviewData, wallName, pe);
      continue;
    }
    if (t.type === 'entry_door') {
      pe.entry_door = findEntryDoorPosition(mapPreviewData, wallName, pe);
      continue;
    }
    // Place key at designated key_position if available
    if (t.type === 'item' && t.item_type === 'key' && keyPos && !occupied.has(keyPos[0]+','+keyPos[1])) {
      pe.items.push({ name: t.name, item_type: t.item_type, x: keyPos[0], y: keyPos[1], ...(t.image ? {image: t.image} : {}) });
      occupied.add(keyPos[0]+','+keyPos[1]);
      continue;
    }
    if (wi >= walkable.length) break;
    const [rx, ry] = walkable[wi++];
    if (t.type === 'monster') pe.monsters.push({ name: t.name, x: rx, y: ry });
    else if (t.type === 'item') pe.items.push({ name: t.name, item_type: t.item_type, x: rx, y: ry, ...(t.image ? {image: t.image} : {}) });
    else if (t.type === 'trap') pe.traps.push({ name: t.name, x: rx, y: ry });
  }

  renderLevelScreen(document.getElementById('screen-container'));
  showCurrentMap();
  showToast(`Placed ${Math.min(tray.length, wi)} entities`, 'success');
}

function trayDragOver(e) {
  e.preventDefault();
  if (!draggedTrayItem || !mapPreviewData?.tiles) return;
  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);
  if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) { trayDragLeave(); return; }
  if (!dragHighlightTile || dragHighlightTile.x !== tx || dragHighlightTile.y !== ty) {
    dragHighlightTile = { x: tx, y: ty };
    // Draw highlight on the canvas
    const ctx = canvas.getContext('2d');
    // Redraw map first (restore from last full render), then overlay highlight
    const c = getCampaign(selectedCampaignId);
    const lv = c.overworld.levels[selectedLevelIdx];
    const design = c.designs[selectedLevelIdx] || {};
    const pe = ensurePlacedEntities(selectedLevelIdx);
    renderMapCanvas(mapPreviewData, lv.palette || [], design.tile_defs || [], pe).then(() => {
      const ctx2 = canvas.getContext('2d');
      ctx2.fillStyle = 'rgba(102, 187, 106, 0.35)';
      ctx2.fillRect(tx * cellW, ty * cellH, cellW, cellH);
      ctx2.strokeStyle = '#66bb6a';
      ctx2.lineWidth = 2;
      ctx2.strokeRect(tx * cellW + 1, ty * cellH + 1, cellW - 2, cellH - 2);
    });
  }
}

function trayDragLeave() {
  if (dragHighlightTile) {
    dragHighlightTile = null;
    // Redraw without highlight
    const c = getCampaign(selectedCampaignId);
    if (c && selectedLevelIdx !== null) {
      const lv = c.overworld.levels[selectedLevelIdx];
      const design = c.designs[selectedLevelIdx] || {};
      const pe = ensurePlacedEntities(selectedLevelIdx);
      renderMapCanvas(mapPreviewData, lv.palette || [], design.tile_defs || [], pe);
    }
  }
}

function trayAutoPlace(levelIdx, trayIdx) {
  const c = getCampaign(selectedCampaignId);
  const pe = ensurePlacedEntities(levelIdx);
  const tray = generateTray(c, levelIdx, pe);
  if (trayIdx >= tray.length) return;
  const t = tray[trayIdx];
  if (!mapPreviewData?.tiles) return;

  // Find a random walkable tile not occupied by anything
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const design = c.designs[levelIdx] || {};
  const defs = design.tile_defs || [];
  const wallName = defs[0]?.name || 'wall';
  const occupied = new Set();
  for (const m of pe.monsters) occupied.add(m.x + ',' + m.y);
  for (const i of pe.items) occupied.add(i.x + ',' + i.y);
  for (const t of pe.traps) occupied.add(t.x + ',' + t.y);
  if (mapPreviewData.player_start) occupied.add(mapPreviewData.player_start[0] + ',' + mapPreviewData.player_start[1]);
  if (mapPreviewData.boss_position) {
    const [bx,by] = mapPreviewData.boss_position;
    for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++) occupied.add((bx+dx)+','+(by+dy));
  }

  const candidates = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const tile = mapPreviewData.tiles[y][x];
      if (tile !== wallName && tile !== 'locked_door' && !occupied.has(x+','+y)) {
        candidates.push([x, y]);
      }
    }
  }
  if (t.type === 'exit_door') {
    pe.exit_door = findExitDoorPosition(mapPreviewData, wallName, pe);
    if (!pe.exit_door) { showToast('No edge wall tile for exit door!', 'error'); return; }
  } else if (t.type === 'entry_door') {
    pe.entry_door = findEntryDoorPosition(mapPreviewData, wallName, pe);
    if (!pe.entry_door) { showToast('No edge wall tile for entry door!', 'error'); return; }
  } else if (t.type === 'boss') {
    // Boss needs 2x2, pick farthest from player
    const [px, py] = mapPreviewData.player_start || [0, 0];
    const spots = [];
    for (let y = 0; y < rows - 1; y++) {
      for (let x = 0; x < cols - 1; x++) {
        const ok = [[x,y],[x+1,y],[x,y+1],[x+1,y+1]].every(([cx,cy]) =>
          mapPreviewData.tiles[cy][cx] !== wallName && mapPreviewData.tiles[cy][cx] !== 'locked_door' && !occupied.has(cx+','+cy));
        if (ok) spots.push([x, y, (x-px)**2 + (y-py)**2]);
      }
    }
    if (spots.length === 0) { showToast('No 2x2 area for boss!', 'error'); return; }
    spots.sort((a,b) => b[2] - a[2]);
    pe.boss = [spots[0][0], spots[0][1]];
  } else {
    // For keys, prefer the recommended key_position from the map
    if (t.item_type === 'key' && mapPreviewData.key_position) {
      const [kx, ky] = mapPreviewData.key_position;
      if (!occupied.has(kx+','+ky)) {
        pe.items.push({ name: t.name, item_type: t.item_type, x: kx, y: ky, ...(t.image ? {image: t.image} : {}) });
        renderLevelScreen(document.getElementById('screen-container'));
        showCurrentMap();
        return;
      }
    }
    if (candidates.length === 0) { showToast('No open tiles!', 'error'); return; }
    const [rx, ry] = candidates[Math.floor(Math.random() * candidates.length)];
    if (t.type === 'monster') pe.monsters.push({ name: t.name, x: rx, y: ry });
    else if (t.type === 'item') pe.items.push({ name: t.name, item_type: t.item_type, x: rx, y: ry, ...(t.image ? {image: t.image} : {}) });
    else if (t.type === 'trap') pe.traps.push({ name: t.name, x: rx, y: ry });
  }

  renderLevelScreen(document.getElementById('screen-container'));
  showCurrentMap();
}

function trayDragStart(e, levelIdx, trayIdx) {
  const c = getCampaign(selectedCampaignId);
  const pe = ensurePlacedEntities(levelIdx);
  const tray = generateTray(c, levelIdx, pe);
  draggedTrayItem = { levelIdx, item: tray[trayIdx] };
  e.dataTransfer.setData('text/plain', 'tray');
  e.dataTransfer.effectAllowed = 'move';
}

function trayDrop(e, levelIdx) {
  e.preventDefault();
  if (!draggedTrayItem || !mapPreviewData?.tiles) return;

  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);
  if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;

  const t = draggedTrayItem.item;
  const pe = ensurePlacedEntities(levelIdx);

  if (t.type === 'exit_door') {
    pe.exit_door = [tx, ty];
  } else if (t.type === 'entry_door') {
    pe.entry_door = [tx, ty];
  } else if (t.type === 'boss') {
    pe.boss = [tx, ty];
  } else if (t.type === 'monster') {
    pe.monsters.push({ name: t.name, x: tx, y: ty });
  } else if (t.type === 'item') {
    pe.items.push({ name: t.name, item_type: t.item_type, x: tx, y: ty, ...(t.image ? {image: t.image} : {}) });
  } else if (t.type === 'trap') {
    pe.traps.push({ name: t.name, x: tx, y: ty });
  }

  draggedTrayItem = null;
  dragHighlightTile = null;
  // Re-render to update tray and map
  renderLevelScreen(document.getElementById('screen-container'));
  showCurrentMap();
}

function mapHoverTooltip(e, levelIdx) {
  const canvas = document.getElementById('map-canvas');
  if (!canvas || !mapPreviewData?.tiles) { canvas.title = ''; return; }
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);
  const c = getCampaign(selectedCampaignId);
  const design = c.designs[levelIdx] || {};
  const pe = design.placed_entities || { monsters: [], items: [], traps: [] };
  let name = '';
  if (pe.boss) {
    const [bx, by] = pe.boss;
    if (tx >= bx && tx < bx + 2 && ty >= by && ty < by + 2) name = design.boss?.name || 'Boss';
  }
  if (!name) { const m = (pe.monsters||[]).find(m => m.x === tx && m.y === ty); if (m) name = m.name; }
  if (!name) { const i = (pe.items||[]).find(i => i.x === tx && i.y === ty); if (i) name = i.name; }
  if (!name) { const t = (pe.traps||[]).find(t => t.x === tx && t.y === ty); if (t) name = t.name; }
  if (!name && pe.exit_door && pe.exit_door[0] === tx && pe.exit_door[1] === ty) name = 'Exit Door';
  if (!name && pe.entry_door && pe.entry_door[0] === tx && pe.entry_door[1] === ty) name = 'Entry Door';
  canvas.title = name;
}

function onMapRightClick(e, levelIdx) {
  e.preventDefault();
  if (!mapPreviewData?.tiles) return;

  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const rows = mapPreviewData.tiles.length;
  const cols = mapPreviewData.tiles[0].length;
  const cellW = canvas.width / cols;
  const cellH = canvas.height / rows;
  const tx = Math.floor((e.clientX - rect.left) * scaleX / cellW);
  const ty = Math.floor((e.clientY - rect.top) * scaleY / cellH);

  const pe = ensurePlacedEntities(levelIdx);
  // Remove any entity at this position
  const hadMonster = pe.monsters.length;
  const hadItem = pe.items.length;
  const hadTrap = pe.traps.length;
  let hadBoss = false;
  let hadExitDoor = false;
  if (pe.boss) {
    const [bx, by] = pe.boss;
    if (tx >= bx && tx < bx + 2 && ty >= by && ty < by + 2) { pe.boss = null; hadBoss = true; }
  }
  if (pe.exit_door) {
    const [ex, ey] = pe.exit_door;
    if (tx === ex && ty === ey) { pe.exit_door = null; hadExitDoor = true; }
  }
  if (pe.entry_door) {
    const [ex, ey] = pe.entry_door;
    if (tx === ex && ty === ey) { pe.entry_door = null; hadExitDoor = true; }
  }
  pe.monsters = pe.monsters.filter(m => m.x !== tx || m.y !== ty);
  pe.items = pe.items.filter(i => i.x !== tx || i.y !== ty);
  pe.traps = pe.traps.filter(t => t.x !== tx || t.y !== ty);

  if (hadBoss || hadExitDoor || pe.monsters.length < hadMonster || pe.items.length < hadItem || pe.traps.length < hadTrap) {
    renderLevelScreen(document.getElementById('screen-container'));
    showCurrentMap();
  }
}
